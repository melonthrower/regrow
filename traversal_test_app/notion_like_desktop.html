<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mosaic Notes</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-width: 1000px; color: #272727; background: #fff; }
    button { font: inherit; }
    .shell { display: grid; grid-template-rows: 46px minmax(0, 1fr); min-height: 100vh; }
    .titlebar { display: grid; grid-template-columns: 245px minmax(0, 1fr) 220px; align-items: center; border-bottom: 1px solid #e8e7e4; background: #fbfbfa; }
    .window-tools { display: flex; align-items: center; gap: 9px; padding-left: 16px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #d6d3ce; }
    .dot:first-child { background: #ff6b5f; } .dot:nth-child(2) { background: #f6c451; } .dot:nth-child(3) { background: #64c866; }
    .crumb { color: #565552; font-size: 13px; }
    .top-actions { justify-self: end; padding-right: 16px; color: #85827d; font-size: 12px; }
    .workspace { display: grid; grid-template-columns: 245px minmax(0, 1fr); min-height: 0; }
    .sidebar { padding: 12px 9px 22px; border-right: 1px solid #e7e5e2; background: #f7f6f3; overflow: auto; }
    .workspace-name { display: flex; align-items: center; gap: 10px; padding: 8px 10px 14px; font-weight: 720; }
    .workspace-icon { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: #fff; background: #333; }
    .sidebar small { display: block; margin: 18px 10px 5px; color: #9a9791; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .sidebar button { display: flex; align-items: center; gap: 10px; width: 100%; margin: 2px 0; padding: 8px 10px; border: 0; border-radius: 6px; color: #65625d; background: transparent; text-align: left; cursor: pointer; }
    .sidebar button[aria-current="page"] { color: #262522; background: #e9e7e2; font-weight: 680; }
    .sidebar-static { padding: 8px 10px; color: #aaa69f; }
    .content { min-width: 0; min-height: 0; overflow: auto; }
    .page { min-height: 100%; padding: 46px 54px 70px; }
    .page-wrap { width: min(1040px, 100%); margin: 0 auto; }
    .page-icon { font-size: 48px; }
    .eyebrow { margin-top: 15px; color: #8c8983; font-size: 12px; }
    h1 { margin: 6px 0 8px; font-size: 36px; letter-spacing: -.04em; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    p { color: #75716c; line-height: 1.55; }
    .tabs { display: flex; gap: 20px; margin-top: 28px; border-bottom: 1px solid #e5e3df; }
    .tabs span { padding: 9px 1px; color: #8a8781; font-size: 13px; }
    .tabs .active { color: #2c2a27; border-bottom: 2px solid #2c2a27; font-weight: 680; }
    .database { overflow: hidden; border: 1px solid #e3e1dd; border-radius: 8px; }
    .database-head, .database-row { display: grid; grid-template-columns: minmax(260px, 1.8fr) 150px 150px 140px; align-items: center; gap: 12px; padding: 13px 16px; }
    .database-head { color: #8c8983; background: #faf9f7; font-size: 11px; font-weight: 720; text-transform: uppercase; }
    .database-row { min-height: 62px; border-top: 1px solid #eeece8; }
    .database-row strong { font-size: 14px; }
    .pill { width: max-content; padding: 4px 8px; border-radius: 99px; color: #685d5a; background: #f0e7e4; font-size: 12px; }
    .open-button, .primary, .secondary { border-radius: 6px; cursor: pointer; }
    .open-button { padding: 7px 10px; border: 0; color: #51499e; background: #eeecfb; font-weight: 650; }
    .primary { padding: 10px 14px; border: 0; color: #fff; background: #34322f; font-weight: 680; }
    .secondary { padding: 9px 12px; border: 1px solid #dcd9d4; color: #45423e; background: #fff; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 18px; }
    .split .database-head, .split .database-row { grid-template-columns: minmax(155px, 1.4fr) 95px 105px 80px; gap: 8px; padding-right: 12px; padding-left: 12px; }
    .peek { padding: 23px; border: 1px solid #dedbd6; border-radius: 10px; background: #fff; box-shadow: -10px 12px 34px rgba(36, 34, 30, .08); }
    .peek dl, .properties { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; margin: 22px 0; }
    dt { color: #8b8781; } dd { margin: 0; font-weight: 620; }
    .detail { max-width: 820px; }
    .callout { margin: 28px 0; padding: 18px; border-radius: 8px; background: #f4f2ef; }
    .detail-actions { display: flex; gap: 10px; }
    .details-panel { margin-top: 24px; padding: 20px; border-left: 3px solid #aaa49c; background: #faf9f7; }
    .wiki-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
    .wiki-card { min-height: 155px; padding: 20px; border: 1px solid #e3e1dd; border-radius: 9px; color: #272727; background: #fff; text-align: left; cursor: pointer; }
    .calendar { overflow: hidden; border: 1px solid #e2e0dc; border-radius: 8px; }
    .week { display: grid; grid-template-columns: repeat(5, 1fr); background: #faf9f7; }
    .day { min-height: 300px; padding: 14px; border-right: 1px solid #e8e6e2; }
    .day:last-child { border-right: 0; }
    .event { margin-top: 46px; padding: 9px; border-radius: 6px; color: #5b5263; background: #ece6ef; font-size: 12px; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="titlebar" data-region-id="notes.titlebar">
      <div class="window-tools"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="crumb" id="crumb">Mosaic Notes / Projects</div>
      <div class="top-actions">Edited just now · Share · •••</div>
    </header>
    <div class="workspace">
      <nav class="sidebar" data-region-id="notes.sidebar">
        <div class="workspace-name"><span class="workspace-icon">M</span><span>Mosaic Notes</span></div>
        <button data-route="/projects" data-action-id="notes.nav.projects">▦ Projects</button>
        <button data-route="/wiki" data-action-id="notes.nav.wiki">▤ Team wiki</button>
        <button data-route="/calendar" data-action-id="notes.nav.calendar">□ Calendar</button>
        <small>Private</small>
        <button data-route="/project-item" data-action-id="notes.nav.website">📝 Website refresh</button>
        <div class="sidebar-static">＋ Quick capture</div>
        <small>Workspace</small>
        <div class="sidebar-static">⌘ Templates</div>
        <div class="sidebar-static">⌫ Trash</div>
      </nav>
      <main class="content" id="content"></main>
    </div>
  </div>
  <script>
    const pages = {
      "/projects": { id: "notes.projects", title: "Projects", root: "/projects" },
      "/project-item": { id: "notes.project-item", title: "Website refresh", root: "/project-item" },
      "/wiki": { id: "notes.wiki", title: "Team wiki", root: "/wiki" },
      "/calendar": { id: "notes.calendar", title: "Calendar", root: "/calendar" }
    };
    const state = { peek: false, details: false, wikiPreview: "" };
    const visits = [];
    const actions = [];
    const route = () => {
      const value = location.hash.replace(/^#/, "") || "/projects";
      return pages[value] ? value : "/projects";
    };
    const visibleRegions = () => {
      const current = route();
      const result = ["notes.titlebar", "notes.sidebar"];
      if (current === "/projects") result.push("notes.projects.database");
      if (current === "/projects" && state.peek) result.push("notes.project.peek");
      if (current === "/project-item") result.push("notes.project.content");
      if (current === "/project-item" && state.details) result.push("notes.project.details");
      if (current === "/wiki") result.push("notes.wiki.content");
      if (current === "/wiki" && state.wikiPreview) result.push("notes.wiki.preview");
      if (current === "/calendar") result.push("notes.calendar.grid");
      return result;
    };
    const pageHead = (icon, title, summary) => `<div class="page-icon">${icon}</div><div class="eyebrow">Mosaic workspace</div><h1>${title}</h1><p>${summary}</p>`;
    function projects() {
      return `<div class="page"><div class="page-wrap">${pageHead("📋", "Projects", "Track active initiatives in one database. Open a row in a side preview before entering its full page.")}<div class="tabs"><span class="active">Table</span><span>Board</span><span>Timeline</span></div><div class="${state.peek ? "split" : ""}"><section class="database" data-region-id="notes.projects.database"><div class="database-head"><span>Name</span><span>Owner</span><span>Status</span><span>Action</span></div><div class="database-row"><strong>Website refresh</strong><span>Jordan Lee</span><span class="pill">In progress</span><button class="open-button" data-action-id="notes.projects.open-peek">Open</button></div><div class="database-row"><strong>Mobile research</strong><span>Priya Shah</span><span class="pill">Planning</span><span>Updated today</span></div><div class="database-row"><strong>Launch checklist</strong><span>Alex Chen</span><span class="pill">Ready</span><span>8 tasks</span></div></section>${state.peek ? `<aside class="peek" data-region-id="notes.project.peek"><div class="eyebrow">Database preview</div><h2>📝 Website refresh</h2><p>This Peek keeps the Projects database visible behind the selected item.</p><dl><dt>Owner</dt><dd>Jordan Lee</dd><dt>Status</dt><dd>In progress</dd><dt>Due</dt><dd>Friday</dd></dl><button class="primary" data-action-id="notes.peek.full-page">Open as full page</button></aside>` : ""}</div></div></div>`;
    }
    function projectItem() {
      return `<div class="page"><article class="page-wrap detail" data-region-id="notes.project.content">${pageHead("📝", "Website refresh", "The selected database item is now the primary page rather than a side Peek.")}<dl class="properties"><dt>Owner</dt><dd>Jordan Lee</dd><dt>Status</dt><dd>In progress</dd><dt>Priority</dt><dd>High</dd><dt>Due date</dt><dd>Friday</dd></dl><div class="callout"><strong>Project brief</strong><p>Update the information architecture and validate the launch content with the research team.</p></div><div class="detail-actions"><button class="secondary" data-action-id="notes.project.show-details">View details</button><button class="primary" data-action-id="notes.project.wiki">Continue to team wiki</button></div>${state.details ? `<aside class="details-panel" data-region-id="notes.project.details"><h2>Page details</h2><p>Created by Jordan · Last edited today · 6 linked tasks</p><button class="secondary" data-action-id="notes.project.hide-details">Close details</button></aside>` : ""}</article></div>`;
    }
    function wiki() {
      return `<div class="page"><section class="page-wrap" data-region-id="notes.wiki.content">${pageHead("📚", "Team wiki", "Durable team knowledge organized separately from the project database.")}<div class="wiki-grid"><button class="wiki-card" data-action-id="notes.wiki.open-principles"><h2>Product principles</h2><p>How the team makes decisions.</p></button><button class="wiki-card" data-action-id="notes.wiki.open-research"><h2>Research library</h2><p>Interview notes and synthesis.</p></button><button class="wiki-card" data-action-id="notes.wiki.open-playbook"><h2>Launch playbook</h2><p>Checklists for every release.</p></button></div>${state.wikiPreview ? `<aside class="peek" data-region-id="notes.wiki.preview"><div class="eyebrow">Wiki preview</div><h2>${state.wikiPreview}</h2><p>This preview contains a concise outline and linked workspace references.</p><button class="secondary" data-action-id="notes.wiki.preview-close">Close preview</button></aside>` : ""}<button class="primary" data-action-id="notes.wiki.calendar">Continue to calendar</button></section></div>`;
    }
    function calendar() {
      return `<div class="page"><section class="page-wrap" data-region-id="notes.calendar.grid">${pageHead("🗓️", "Calendar", "A calendar view of the same workspace with a different primary function.")}<div class="calendar"><div class="week"><div class="day"><strong>Mon 18</strong></div><div class="day"><strong>Tue 19</strong><div class="event">Research review · 10:00</div></div><div class="day"><strong>Wed 20</strong></div><div class="day"><strong>Thu 21</strong><div class="event">Content handoff · 14:00</div></div><div class="day"><strong>Fri 22</strong></div></div></div><button class="primary" data-action-id="notes.calendar.return-projects">Return to Projects preview</button></section></div>`;
    }
    const renderers = { "/projects": projects, "/project-item": projectItem, "/wiki": wiki, "/calendar": calendar };
    function render() {
      const current = route();
      const page = pages[current];
      visits.push(page.id);
      document.body.dataset.pageId = page.id;
      document.body.dataset.stateKey = `${page.id}|${state.peek ? "peek" : "no-peek"}|${state.details ? "details" : "no-details"}|${state.wikiPreview || "no-wiki-preview"}`;
      document.querySelectorAll("[data-route]").forEach(button => button.setAttribute("aria-current", button.dataset.route === page.root ? "page" : "false"));
      document.getElementById("crumb").textContent = `Mosaic Notes / ${page.title}`;
      document.getElementById("content").innerHTML = renderers[current]();
    }
    function record(actionId) { actions.push({ actionId, pageId: pages[route()].id, regions: visibleRegions() }); }
    function navigate(target, next = {}) {
      Object.assign(state, { peek: false, details: false, wikiPreview: "" }, next);
      if (route() === target) render(); else location.hash = target;
    }
    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action-id]");
      if (!target) return;
      const id = target.dataset.actionId;
      record(id);
      if (target.dataset.route) return navigate(target.dataset.route);
      if (id === "notes.projects.open-peek") { state.peek = true; render(); }
      else if (id === "notes.peek.full-page") navigate("/project-item");
      else if (id === "notes.project.show-details") { state.details = true; render(); }
      else if (id === "notes.project.hide-details") { state.details = false; render(); }
      else if (id === "notes.project.wiki") navigate("/wiki");
      else if (id === "notes.wiki.open-principles") { state.wikiPreview = "Product principles"; render(); }
      else if (id === "notes.wiki.open-research") { state.wikiPreview = "Research library"; render(); }
      else if (id === "notes.wiki.open-playbook") { state.wikiPreview = "Launch playbook"; render(); }
      else if (id === "notes.wiki.preview-close") { state.wikiPreview = ""; render(); }
      else if (id === "notes.wiki.calendar") navigate("/calendar");
      else if (id === "notes.calendar.return-projects") navigate("/projects", { peek: true });
    });
    addEventListener("hashchange", render);
    window.__fixture = { snapshot: () => ({ pageId: pages[route()].id, stateKey: document.body.dataset.stateKey, regions: visibleRegions(), visits: [...visits], actions: [...actions] }) };
    render();
  </script>
</body>
</html>
