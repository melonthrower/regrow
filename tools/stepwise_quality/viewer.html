<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>遍历质量检查</title>
<style>
:root{font:15px/1.65 system-ui,sans-serif;color:#24333b;background:#f4f6f7}body{margin:0}header{padding:22px 30px;background:#163e48;color:white}h1{font-size:23px;margin:0}header p{margin:5px 0;opacity:.85}.bar{padding:14px 28px;background:white;position:sticky;top:0;z-index:3;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #d9e2e5}input,select,button,textarea{font:inherit;border:1px solid #cbd5d9;border-radius:6px;padding:6px 10px}button{cursor:pointer;background:#f0f6f6}main{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:20px;max-width:1500px;margin:auto}nav{max-height:80vh;overflow:auto}nav button{display:block;text-align:left;width:100%;margin-bottom:6px;background:white}nav button.active{border:2px solid #267b89}article{background:white;border-radius:10px;padding:22px;min-width:0}h2{margin:0 0 8px;font-size:21px}.muted{color:#627680;font-size:13px}.tag{display:inline-block;border-radius:4px;padding:2px 7px;margin-right:6px;background:#e8edef}.problem{background:#ffe1df}.insufficient{background:#fff1cb}.reasonable{background:#e0f4e8}.refine{background:#e6e8ff}.evidence{display:flex;gap:16px;flex-wrap:wrap}figure{margin:8px 0;max-width:460px}.picture{position:relative;display:inline-block;line-height:0}.picture img{max-width:100%;max-height:620px;object-fit:contain}.box{position:absolute;border:2px solid #ef6654;box-sizing:border-box;pointer-events:none}figcaption{font-size:12px;word-break:break-all}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7f8;padding:12px;font-size:12px;max-height:550px;overflow:auto}details{margin:12px 0}section{border-top:1px solid #e1e8eb;padding-top:12px;margin-top:16px}textarea{display:block;width:90%;margin:10px 0}#summary{font-size:13px}a{color:#207686}@media(max-width:760px){main{grid-template-columns:1fr}nav{max-height:220px}}
</style>
<header><h1>遍历质量检查</h1><p>原图与登记证据 · 允许合理划分与后续细化 · 检查结果不修改源图</p><div id="summary"></div></header>
<div class="bar"><select id="kind"><option value="">全部对象</option><option value="call">逐次登记</option><option value="region">区块</option><option value="control">控件</option><option value="task">任务</option><option value="function">功能语义</option><option value="edge">跳转</option></select><select id="status"><option value="">全部结论</option><option value="problem">明确问题</option><option value="insufficient">证据不足</option><option value="refine">建议调整</option><option value="reasonable">合理</option><option value="unchecked">未做语义检查</option></select><input id="search" placeholder="搜索对象或编号"><button id="reload">刷新</button><span id="message" class="muted"></span></div>
<main><nav id="list"></nav><article id="detail"></article></main>
<script>
const REPORT=__REPORT_DATA__,TOKEN='__REVIEW_TOKEN__';
const labels={reasonable:'合理',refine:'新证据支持调整',problem:'明确问题',insufficient:'证据不足',unchecked:'未做语义检查',region:'区块',control:'控件',task:'任务',function:'功能',edge:'跳转',call:'逐次登记',agree:'认可',disagree:'否定',uncertain:'仍不确定'};
const $=s=>document.getElementById(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=null;
function states(i){return [...i.checks.map(c=>c.verdict),...i.judgments.map(j=>j.result.verdict),...(i.judgments.length?[]:['unchecked'])]}
function badge(v){return `<span class="tag ${esc(v)}">${esc(labels[v]||v)}</span>`}
function showList(){const text=$('search').value.toLowerCase();const rows=REPORT.items.filter(i=>(!$('kind').value||i.kind===$('kind').value)&&(!$('status').value||states(i).includes($('status').value))&&(i.title+' '+i.id).toLowerCase().includes(text));$('list').innerHTML=rows.map(i=>`<button data-id="${esc(i.id)}" class="${i.id===current?'active':''}">${esc(i.title)}<br><span class="muted">${esc(labels[i.kind])} · ${esc(i.id)}</span><br>${i.judgments.length?badge(i.judgments.at(-1).result.verdict):badge('unchecked')}${i.checks.some(c=>c.verdict==='problem')?' · 结构问题':''}</button>`).join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.id));if(!current&&rows.length)select(rows[0].id)}
function picture(im){let box='';for(const [b,color] of [[im.box,'#ef6654'],[im.click_box,'#237de1']]){if(b&&im.size)box+=`<span class="box" style="border-color:${color};left:${100*b.left/im.size[0]}%;top:${100*b.top/im.size[1]}%;width:${100*(b.right-b.left)/im.size[0]}%;height:${100*(b.bottom-b.top)/im.size[1]}%"></span>`}return `<figure><a href="${esc(im.path)}" target="_blank"><div class="picture"><img loading="lazy" src="${esc(im.path)}">${box}</div></a><figcaption>${esc(im.id)} · ${esc(im.role)} · ${esc(im.size.join('×'))}<br>${esc(im.source)}</figcaption></figure>`}
function select(id){current=id;const i=REPORT.items.find(x=>x.id===id);$('detail').innerHTML=`<h2>${esc(i.title)}</h2><div class="muted">${esc(i.id)} · 冻结版本 ${esc(REPORT.snapshot)}</div><p>语义检查：${i.judgments.length?i.judgments.map(j=>esc(j.reviewer)+' '+badge(j.result.verdict)).join(' '):'尚未执行；结构检查无错误不代表语义合格。'}</p><details><summary>证据图片（${i.images.length}）；红框：身份范围；蓝框：点击区域。均为待检查记录，不是标准答案</summary><div class="evidence">${i.images.map(picture).join('')||'没有可用图片。'}</div></details><section><b>结构检查与证据缺口</b>${i.checks.map(c=>`<p>${badge(c.verdict)}${esc(c.reason)} <span class="muted">${esc(c.code)}</span></p>`).join('')||'<p>未发现已实现规则能识别的结构问题。</p>'}</section><section><b>独立检查结论</b>${i.judgments.map(j=>`<p>${esc(j.reviewer)} ${badge(j.result.verdict)}</p><p>观察：${esc(j.result.observations)}</p><p>依据：${esc(j.result.reason)}</p><p>类型：${esc(j.result.types.join(', '))} · 影响：${esc(({presentation:'展示',understanding:'理解与复用',execution:'执行或结果可信度'})[j.result.impact])}</p><p>引用：${esc(j.result.evidence.join(', '))}</p>${j.result.new_evidence?'<p>新证据：'+esc(j.result.new_evidence)+'</p>':''}`).join('')||'<p>未检查。</p>'}${(i.review_failures||[]).map(f=>'<p>检查未接受：'+esc(f.reviewer)+' · '+esc(f.type)+'</p>').join('')}</section><details><summary>${i.kind==='call'?'当时请求、原回复与实际登记差异':'对象记录与语义声明'}</summary><pre>${esc(JSON.stringify(i.data,null,2))}</pre></details><section><b>人类复核（保留每次意见）</b><p class="muted">复核自动结论和结构检查；不会改写原图或自动结论。</p>${i.human.map(h=>`<p>${esc(labels[h.decision])} · ${esc(h.note)} <span class="muted">${esc(h.at)}</span></p>`).join('')}<textarea id="note" placeholder="简短说明；否定时必填"></textarea><button data-decision="agree">认可</button> <button data-decision="disagree">否定</button> <button data-decision="uncertain">仍不确定</button></section>`;$('detail').querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>submit(b.dataset.decision));showList()}
async function submit(decision){const value={item_id:current,decision,note:$('note').value};if(decision==='disagree'&&!value.note.trim()){$('message').textContent='否定时请写一句原因。';return}if(!TOKEN){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));a.download='human-feedback.json';a.click();URL.revokeObjectURL(a.href);$('message').textContent='已导出意见；服务模式可直接保存。';return}try{const r=await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify(value)});if(!r.ok)throw Error('保存失败');location.reload()}catch(e){$('message').textContent=e.message}}
const counts={};REPORT.items.forEach(i=>{counts[i.kind]=(counts[i.kind]||0)+1});const checked=REPORT.items.filter(i=>i.judgments.length).length;$('summary').textContent=`共 ${REPORT.items.length} 项 · 已做语义检查 ${checked} · 未检查 ${REPORT.items.length-checked} · ${Object.entries(counts).map(([k,v])=>labels[k]+' '+v).join(' / ')}。不代表应用覆盖完整。`;
['kind','status','search'].forEach(id=>$(id).oninput=()=>{current=null;showList()});$('reload').onclick=()=>location.reload();showList();
</script></html>
