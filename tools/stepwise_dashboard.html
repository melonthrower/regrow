<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用探索 · 当前任务</title>
<style>
:root{font:14px/1.65 system-ui,sans-serif;color:#273c36;background:#edf2ee}*{box-sizing:border-box}body{margin:0}header{padding:14px 24px;background:white;border-bottom:1px solid #d8e2da;display:flex;gap:24px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 8px}button{font:inherit;border:1px solid #bdcfc1;border-radius:8px;padding:6px 16px;background:white;cursor:pointer}button.active{color:white;background:#246950;border-color:#246950}nav{display:flex;gap:8px}main{display:grid;grid-template-columns:minmax(320px,48%) 1fr;gap:20px;padding:20px;height:calc(100vh - 74px)}.left{display:flex;flex-direction:column;gap:12px;min-height:0}.card{background:white;border:1px solid #d8e2da;border-radius:14px;padding:16px}.screen{flex:1;min-height:240px;display:flex;flex-direction:column;background:#17241f;color:#e2eee6;text-align:center}.screen img{width:100%;flex:1;min-height:0;object-fit:contain;margin:8px 0}.screen small{color:#b5c7bd}.right{overflow:auto;min-width:0}.muted,small{color:#667b6e}.metrics{display:flex;gap:22px;flex-wrap:wrap}.metrics b{font-size:22px;display:block}.warning{color:#985826}.tree details{border-left:2px solid #d9e6dd;margin:6px 0;padding-left:14px}.tree summary{cursor:pointer}.current{color:#157346;font-weight:600}.task{padding:3px 0;color:#52675a;font-size:13px}ul{padding-left:22px;margin:6px 0}.chip{background:#e8f2eb;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:400;color:#4c6856}#current-tree{margin-bottom:18px}#error{color:#a5492b}#phase{margin-top:8px}.history-note{margin:8px 0;font-size:12px}#totals{margin:8px 0}.crop{max-width:100%;max-height:160px;object-fit:contain;display:block;margin:8px 0}#search{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid #ccdacd;margin:6px 0 12px}@media(max-width:800px){main{grid-template-columns:1fr;height:auto;padding:12px}.screen{height:52vh;flex:auto}.right{overflow:visible}header{padding:12px}}

main{grid-template-columns:minmax(350px,1fr) minmax(330px,44%);height:auto;align-items:start;max-width:1600px;margin:auto}.left{position:sticky;top:16px}.screen{height:58vh;flex:auto}.right{overflow:visible;background:transparent;border:0;padding:0}.eyebrow{font-size:12px;font-weight:600;color:#587364;margin-bottom:6px}.focus{border-top:4px solid #257458;padding:20px}.focus h2{font-size:21px;line-height:1.45;margin:0 0 12px;overflow-wrap:anywhere}.focus h3{font-size:17px;margin:10px 0}.focus p{margin:8px 0;overflow-wrap:anywhere}.focus .task-title{font-size:20px;color:#1b583f;font-weight:650;line-height:1.5}.focus .detail-line{font-size:13px;color:#52675a}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.step{background:#f2f5f2;border:1px solid #d8e2da;padding:9px;border-radius:9px;font-size:12px;color:#667b6e}.step b{display:block;font-size:14px}.step.active{background:#def0e4;border-color:#37855d;color:#164e32}.notice{background:#fff2d8;color:#775021;border-radius:8px;padding:10px;margin-top:12px}.queue-row{padding:10px 0;border-top:1px solid #e7eee9;overflow-wrap:anywhere}.queue-row.active{background:#edf7ee;padding:10px;border-radius:8px}.queue-row summary{cursor:pointer}.pill{display:inline-block;border:1px solid #ccdcd0;border-radius:20px;padding:1px 8px;font-size:11px;margin:0 6px 4px 0;color:#42624e}.queue-row small{display:block}.right>.card,.right>details{margin-bottom:14px}.metric-mini{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#65756a}.timeline summary{cursor:pointer;overflow-wrap:anywhere}.timeline .entry{border-bottom:1px solid #e0e9e3;padding:12px 0}.timeline p{font-size:13px;overflow-wrap:anywhere}.evidence-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.evidence-pair img{width:100%;border-radius:6px}.evidence-pair figure{margin:0}.evidence-pair figcaption{font-size:12px;color:#617567}.history-title{cursor:pointer;font-weight:600}.empty{padding:10px 0;color:#687b6e;font-size:13px}#queue-count{font-size:13px;font-weight:400;color:#6c7c70}#focus-call{font-size:12px;color:#687c6e}#task-purpose{font-size:14px;line-height:1.8}.section-note{font-size:12px;color:#718075;margin-top:5px}#current-tree details{font-size:13px}#extra-stage[hidden]{display:none}#run-alert:empty{display:none}#run-alert{padding:10px;border-radius:8px;background:#fff1dc;color:#7b4e24}.flow-note{font-size:11px;color:#758477}@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}.left{position:static}.screen{height:48vh}.focus{padding:16px}header{padding:12px}.evidence-pair{grid-template-columns:1fr}}
</style>
<header><h1>应用探索 · 当前任务</h1><nav id="apps" aria-label="切换应用"></nav><span id="status" class="muted">连接中</span></header>
<main>
<section class="left">
 <div class="card focus">
  <div class="eyebrow" id="focus-label">当前工作区块</div><h2 id="focus-region">正在读取…</h2>
  <div class="flow" aria-label="遍历的三个阶段"><div class="step" data-phase="discovery">01<b>发现与提出任务</b></div><div class="step" data-phase="action">02<b>选择并执行动作</b></div><div class="step" data-phase="update">03<b>观察与登记</b></div></div>
  <span id="extra-stage" class="pill" hidden></span><div id="phase" class="detail-line"></div><div id="focus-call"></div>
  <div class="eyebrow" style="margin-top:16px" id="task-label">正在处理的任务</div><div class="task-title" id="task">尚未选定</div>
  <p id="task-owner" class="detail-line"></p><p id="task-purpose"></p><p id="task-product" class="detail-line"></p><div id="task-conditions"></div>
  <div id="run-alert" role="status"></div><div id="error" role="status"></div>
 </div>
 <div class="card screen"><span>框架最近一次真实观察</span><img id="frame" alt="应用最近一次真实截图"><small id="frame-note">仅在框架取图后更新</small></div>
 <div class="card"><div class="metric-mini"><span>模型调用 <b id="http">—</b></span><span>界面操作 <b id="gui">—</b></span><span>已检查批次 <b id="reviews">—</b></span></div><p id="batch-note" class="section-note"></p><div id="review" class="section-note"></div></div>
</section>
<aside class="right">
 <section class="card"><h2>这个区块在探索什么 <span id="queue-count"></span></h2><div id="region-purpose" class="section-note"></div><div id="task-queue"></div><p class="section-note">待办来自已有任务记录；清点完成前，任务数还可能增加。</p></section>
 <section class="card timeline"><h2>最近做了什么</h2><p class="section-note">展开操作可回看真实前后图与登记结果；已投递不等于任务完成。</p><div id="actions"></div><details><summary class="section-note">模型处理记录（含发现、总结与纠错）</summary><div id="calls"></div></details></section>
 <details class="card"><summary class="history-title">当前可交互区块</summary><div id="current-tree" class="tree"></div></details>
 <details class="card"><summary class="history-title">全部区块与历史任务</summary><div id="totals"></div><input id="search" placeholder="搜索区块、控件或任务" aria-label="搜索区块、控件或任务"><div id="all-tree" class="tree"></div><small id="snapshot"></small></details>
</aside>
</main>
<script>
const $=id=>document.getElementById(id),put=(id,text)=>$(id).textContent=text;
let key=null,latest=null,signature=null,frameTime=null,generation=0;
const statuses={done:'已完成',pending:'待探索',blocked:'暂挂',record_only:'仅记录'};
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function currentTree(nodes,box){for(const n of nodes){const d=element('details');d.open=true;d.append(element('summary',n.name,'current'));const ul=element('ul');for(const c of n.controls||[])ul.append(element('li',c.name));d.append(ul);currentTree(n.children||[],d);box.append(d)}}
function renderTree(){if(!latest)return;const graph=latest.graph,box=$('all-tree'),query=$('search').value.trim().toLowerCase();
const opened=new Set([...box.querySelectorAll('details[open]')].map(d=>d.dataset.id));box.replaceChildren();
for(const n of graph.nodes){if(query&&!JSON.stringify(n).toLowerCase().includes(query))continue;const d=element('details');d.dataset.id=n.id;d.open=opened.has(n.id)||n.current||!!query;
const title=element('summary',n.name,n.current?'current':'');title.append(element('span',n.current?' 当前':n.working?' 工作目标':' 历史区块','chip'));d.append(title);
const p=n.progress;d.append(element('small',p.inventory_complete?`探索任务：${p.done.length} 完成 · ${p.pending.length} 待探索 · ${p.blocked.length} 暂挂`:'任务尚未清点完整'));
for(const c of n.controls){const control=element('details');control.dataset.id=c.id;control.open=opened.has(c.id)||!!query;control.append(element('summary',c.name));
for(const t of c.tasks||[])control.append(element('div',`${statuses[t.status]||t.status} · ${t.name}`,'task'));
if(!c.tasks?.length)control.append(element('div','尚无任务记录','muted'));if(c.image){const img=element('img');img.alt=c.name+' · 登记时的身份截图';img.className='crop';img.loading='lazy';img.src='/image/'+key+c.image.slice('/graph-image'.length);control.append(img)}d.append(control)}
const bound=new Set(n.controls.flatMap(c=>(c.tasks||[]).map(t=>t.name)));for(const [state,names] of Object.entries(p)){if(!Array.isArray(names))continue;for(const name of names)if(!bound.has(name))d.append(element('div',`${statuses[state]||state} · ${name}（区块任务）`,'task'))}box.append(d)}}
function paragraph(box,label,value){if(value){const p=element('p');p.append(element('strong',label+'：'),document.createTextNode(typeof value==='string'?value:JSON.stringify(value)));box.append(p)}}
function renderFocus(v){const f=v.focus,p=v.progress,running=p.status==='running',t=f.task;
put('focus-label',running?'当前工作区块':'最近工作区块');put('focus-region',f.region);put('region-purpose',f.description);
const standalone=f.stage==='总结区块功能'||p.phase==='recovery';$('extra-stage').hidden=!standalone;put('extra-stage',f.stage==='总结区块功能'?'区块功能总结 · 独立整理':'异常恢复');document.querySelectorAll('.step').forEach(el=>el.classList.toggle('active',running&&!standalone&&el.dataset.phase===p.phase));
put('phase',(running?'正在：':'停在：')+f.stage+' · '+(p.detail||''));put('focus-call',f.call?'调用 '+f.call+(f.waiting?(running?' · 等待回复':' · 未收到回复'):' · 回复已返回，登记状态以记录为准'):'正在准备下一阶段');
put('task-label',t?(running?'正在处理的任务':['done','record_only'].includes(t.status)?'最近处理的任务':'保留的任务'):'本阶段工作');put('task',t?.name||f.stage);
put('task-owner',t?'任务归属：'+t.region+(t.control?' · 控件：'+t.control:''):'当前没有绑定单个控件任务');
put('task-purpose',t?.purpose|| (t?'任务目的尚未登记':f.stage==='清点探索任务'?'正在整理这个区块有哪些值得探索的任务。':f.stage==='总结区块功能'?'正在根据已登记知识整理区块功能。':'正在识别或处理当前界面，具体任务以登记结果为准。'));
put('task-product',t?.product?'需要登记：'+t.product+(f.preparing?' · 本次是前置准备，不代表目标任务完成':''):'');$('task-conditions').replaceChildren();for(const c of t?.conditions||[])$('task-conditions').append(element('span','适用：'+c,'pill'));
put('run-alert',p.blocker?((p.blocker.reason||'当前处理受阻')+' '+(p.blocker.next||'')):p.repair?'正在纠错：'+p.repair.reason:t?.gap?'任务缺口：'+(typeof t.gap==='string'?t.gap:JSON.stringify(t.gap)):'');
const tasks=f.tasks, counts={};for(const row of tasks)counts[row.status]=(counts[row.status]||0)+1;put('queue-count',`${counts.pending||0} 待探索 · ${counts.blocked||0} 暂挂 · ${counts.done||0} 已完成 · ${counts.record_only||0} 仅记录`);
const box=$('task-queue'),opened=new Set([...box.querySelectorAll('details[open]')].map(d=>d.dataset.name));box.replaceChildren();
for(const row of [...tasks].sort((a,b)=>Number(b.name===t?.name&&b.region===t.region)-Number(a.name===t?.name&&a.region===t.region))){const active=!!t&&row.name===t.name&&row.region===t.region;const d=element('details',undefined,'queue-row'+(active?' active':''));d.dataset.name=row.name;d.open=active||opened.has(row.name);const summary=element('summary');summary.append(element('span',active&&running?'正在处理':statuses[row.status]||row.status,'pill'),document.createTextNode(row.name));d.append(summary);paragraph(d,'探索目的',row.purpose);paragraph(d,'需要登记',row.product);paragraph(d,'适用条件',row.conditions.join('；'));paragraph(d,'已登记知识',row.knowledge);paragraph(d,'缺口',row.gap);box.append(d)}
if(!tasks.length)box.append(element('div','尚未登记任务，当前正在补充观察或清点。','empty'));
const actions=$('actions'),expanded=new Set([...actions.querySelectorAll('details[open]')].map(d=>d.dataset.id));actions.replaceChildren();
for(const row of f.actions){const d=element('details',undefined,'entry');d.dataset.id=row.attempt;d.open=expanded.has(row.attempt);d.append(element('summary',row.attempt+' · '+row.control+' · '+row.state));paragraph(d,'任务',row.task);paragraph(d,'为什么操作',row.purpose);paragraph(d,'观察到的结果',row.result);paragraph(d,'登记知识',row.knowledge);paragraph(d,'用途条件',row.conditions.join('；'));const pair=element('div',undefined,'evidence-pair');for(const frame of row.images){const fig=element('figure'),img=element('img');img.loading='lazy';img.alt=row.attempt+' '+(frame==='before'?'动作前真实截图':'动作后真实截图');img.src='/evidence/'+key+'?attempt='+encodeURIComponent(row.attempt)+'&frame='+frame;fig.append(img,element('figcaption',frame==='before'?'动作前':'动作后'));pair.append(fig)}d.append(pair);actions.append(d)}
if(!f.actions.length)actions.append(element('div','尚无界面操作记录。','empty'));$('calls').replaceChildren();for(const c of f.calls)$('calls').append(element('p',c.id+' · '+c.stage+' · '+(c.task||c.region)+' · '+(c.reply?'回复已返回（不等于登记完成）':'无回复记录')));
}
async function refresh(){const token=generation,selected=key;if(!selected||document.hidden)return;
try{const response=await fetch('/api/'+selected,{cache:'no-store'});if(!response.ok)throw Error();const v=await response.json();if(token!==generation)return;latest=v;
const a=v.accounting,p=v.progress,g=v.graph,l=a.latest;put('status',p.status==='running'?'正在探索':p.status==='interrupted'?'执行中断':'当前阶段已停止');put('http',`${a.http} / ${v.limits.max_http}`);put('gui',`${a.gui} / ${v.limits.max_gui_commands}`);put('reviews',a.reviewed_steps);put('batch-note','调用包含发现、动作选择、更新、总结与纠错；三步不对应固定三次调用。');put('review',l?.status==='running'?'本批连续运行中，结束后统一检查':l?.review_state==='held'?'核对后暂缓：'+l.review_reason:l?.review_state==='continued_with_issue'?'保留问题继续：'+l.review_reason:l&&!l.reviewed?'本批已停止，待统一检查':'');put('error','');renderFocus(v);
const complete=g.nodes.filter(n=>n.progress.complete).length,pending=g.nodes.reduce((s,n)=>s+n.progress.pending.length,0),blocked=g.nodes.reduce((s,n)=>s+n.progress.blocked.length,0),unplanned=g.nodes.filter(n=>!n.progress.inventory_complete).length;put('totals',`${g.nodes.length} 个已发现区块 · ${complete} 个直属探索完成 · ${pending} 个待探索任务 · ${blocked} 个暂挂 · ${unplanned} 个区块待清点`);put('snapshot','已提交图：'+g.snapshot);
const next=JSON.stringify([selected,g.snapshot]);if(signature!==next){signature=next;const box=$('current-tree');box.replaceChildren();currentTree(g.page_context?.current_tree||[],box);if(!box.childNodes.length)box.textContent='当前前景尚未登记';renderTree()}
if(frameTime!==v.frame_time){frameTime=v.frame_time;$('frame').src='/frame/'+selected+'?t='+encodeURIComponent(frameTime||Date.now())}put('frame-note','最近真实观察：'+(v.frame_time?new Date(v.frame_time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）':'时间未记录')+'；非连续投屏。图可能仍在等待这张新截图登记。');
}catch(e){if(token===generation){put('error','连接中断或正在发布新快照，保留上次数据并自动重试');put('status','等待刷新');document.querySelectorAll('.step').forEach(el=>el.classList.remove('active'))}}}
function select(selected){key=selected;generation++;latest=null;signature=null;frameTime=null;$('current-tree').replaceChildren();$('all-tree').replaceChildren();$('frame').removeAttribute('src');put('error','');put('status','连接中');put('phase','正在读取所选应用…');put('batch-note','正在读取所选应用的本批预算；小步为一次原生框架处理。');for(const id of ['task','review','totals','snapshot','task-purpose','task-owner','task-product','run-alert','focus-call','region-purpose','queue-count'])put(id,'');for(const id of ['task-queue','actions','calls','task-conditions'])$(id).replaceChildren();put('focus-region','正在读取…');$('extra-stage').hidden=true;document.querySelectorAll('.step').forEach(el=>el.classList.remove('active'));put('frame-note','等待所选应用的真实观察');for(const id of ['http','gui','reviews'])put(id,'—');document.querySelectorAll('#apps button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));refresh()}
$('search').oninput=renderTree;$('frame').onerror=()=>{frameTime=null;put('frame-note','截图暂不可用；下一次刷新重试')};
fetch('/apps.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(apps=>{for(const a of apps){const b=element('button',a.label);b.dataset.key=a.key;b.onclick=()=>select(a.key);$('apps').append(b)}select(apps[0].key)}).catch(()=>put('error','应用列表读取失败，请刷新页面'));
setInterval(refresh,2000);
</script>
</html>
