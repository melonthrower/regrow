<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReWalk Fixture Oracle</title>
  <style>
    :root { color-scheme: light; --ink:#182230; --muted:#627083; --line:#d7dee8; --surface:#fff; --canvas:#edf1f6; --primary:#2356d8; --soft:#e8efff; --teal:#087f72; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:var(--canvas); font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,select { font:inherit; }
    .shell { width:min(1180px,100%); margin:0 auto; padding:28px 20px 60px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; }
    h1 { margin:0 0 5px; font-size:30px; } h2 { margin:0 0 12px; font-size:20px; } p { margin:0; }
    .muted { color:var(--muted); }
    .button { display:inline-flex; align-items:center; min-height:42px; padding:0 14px; border:1px solid var(--line); border-radius:11px; color:var(--primary); background:var(--surface); text-decoration:none; font-weight:700; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .stat { padding:16px; border:1px solid var(--line); border-radius:15px; background:var(--surface); }
    .stat strong { display:block; font-size:27px; } .stat span { color:var(--muted); }
    .panel { padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    .map { margin-bottom:18px; overflow-x:auto; }
    svg { display:block; width:100%; height:auto; }
    .edge { fill:none; stroke:#9aa7b8; stroke-width:2; marker-end:url(#arrow); }
    .edge.peer { stroke:var(--primary); stroke-dasharray:7 6; opacity:.55; }
    .group { fill:var(--soft); fill-opacity:.28; stroke:var(--primary); stroke-dasharray:8 7; }
    .node { cursor:pointer; }
    .node rect { fill:#fff; stroke:#aab5c5; stroke-width:2; rx:14; }
    .node text { fill:var(--ink); font-weight:700; text-anchor:middle; dominant-baseline:middle; }
    .node.selected rect { fill:var(--soft); stroke:var(--primary); stroke-width:3; }
    .node.scroll rect { stroke:var(--teal); }
    .map-label { fill:var(--muted); font-size:13px; }
    .controls { display:flex; align-items:end; gap:14px; margin-bottom:18px; }
    label { display:grid; gap:6px; font-weight:700; }
    select { min-width:240px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .detail-grid { display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:18px; }
    .stack { display:grid; gap:18px; }
    .badge { display:inline-flex; min-height:26px; align-items:center; padding:2px 9px; border-radius:999px; color:#17408f; background:var(--soft); font-size:12px; font-weight:800; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
    tr:last-child td { border-bottom:0; }
    code { font:13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .anchor-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    @media (max-width:800px) { header{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}.controls{align-items:stretch;flex-direction:column}select{width:100%} }
  </style>
</head>
<body>
  <script type="application/json" id="fixture-oracle">__REWALK_ORACLE_JSON__</script>
  <div class="shell">
    <header><div><h1>ReWalk Fixture Oracle</h1><p class="muted">Canonical Pages, Regions, controls, transitions, variants, and scroll contracts.</p></div><a class="button" id="open-page" href="index.html#/home">Open selected app page</a></header>
    <section class="stats" id="stats" aria-label="Oracle counts"></section>
    <section class="panel map"><h2>Canonical relationship map</h2><svg viewBox="0 0 920 500" role="img" aria-label="Nine canonical pages and their main transitions"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa7b8"></path></marker></defs><rect class="group" x="30" y="25" width="430" height="300" rx="24"></rect><text class="map-label" x="48" y="50">Shared bottom navigation: Home · Library · Activity · Settings</text><g id="edges"></g><g id="nodes"></g></svg></section>
    <div class="controls"><label>Inspect Page<select id="page-select"></select></label><span class="muted" id="page-note"></span></div>
    <section class="detail-grid"><div class="stack"><article class="panel" id="identity"></article><article class="panel"><h2>Blocks</h2><table><thead><tr><th>ID</th><th>Role</th><th>Scroll</th></tr></thead><tbody id="blocks"></tbody></table></article><article class="panel" id="scroll"></article></div><div class="stack"><article class="panel"><h2>Controls</h2><table><thead><tr><th>Label</th><th>Type</th><th>Block / policy</th></tr></thead><tbody id="controls"></tbody></table></article><article class="panel"><h2>Outgoing transitions</h2><table><thead><tr><th>Action</th><th>Target</th><th>Effect / coverage</th></tr></thead><tbody id="transitions"></tbody></table></article></div></section>
  </div>
  <script>
    (() => {
      const oracle = JSON.parse(document.getElementById("fixture-oracle").textContent);
      const pages = new Map(oracle.pages.map(page => [page.id, page]));
      const select = document.getElementById("page-select");
      const positions = { home:[135,105], library:[355,105], activity:[135,245], settings:[355,245], record_detail:[600,105], workspace:[820,105], coverage_report:[600,245], done:[820,245], about:[600,405] };
      const canonical = [
        ["home","library","Start tour"],["home","activity","Activity"],["home","settings","Settings"],["home","workspace","Planning"],
        ["library","record_detail","Open record"],["activity","coverage_report","Report"],["coverage_report","done","Finish"],
        ["settings","about","About"],["about","home","Return"],["record_detail","library","Back"],["done","home","Return"]
      ];
      const svgNS = "http://www.w3.org/2000/svg";
      function el(name,attrs={}) { const node=document.createElementNS(svgNS,name); Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v)); return node; }
      function draw() {
        const edgeRoot=document.getElementById("edges"), nodeRoot=document.getElementById("nodes");
        canonical.forEach(([a,b,label]) => { const [x1,y1]=positions[a], [x2,y2]=positions[b]; const line=el("path",{class:"edge",d:`M ${x1+62} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2-62} ${y2}`}); edgeRoot.append(line); const t=el("text",{class:"map-label",x:(x1+x2)/2,y:(y1+y2)/2-6}); t.textContent=label; edgeRoot.append(t); });
        [["home","library"],["library","activity"],["activity","settings"],["settings","home"]].forEach(([a,b])=>{const [x1,y1]=positions[a],[x2,y2]=positions[b];edgeRoot.prepend(el("path",{class:"edge peer",d:`M ${x1} ${y1+34} L ${x2} ${y2+34}`}));});
        oracle.pages.forEach(page => { const [x,y]=positions[page.id]; const g=el("g",{class:`node ${page.scroll.classification === "scrollable" ? "scroll" : ""}`,"data-page":page.id,transform:`translate(${x-70} ${y-30})`,role:"button","aria-label":page.title}); const r=el("rect",{width:140,height:60}); const t=el("text",{x:70,y:30}); t.textContent=page.title; g.append(r,t); g.addEventListener("click",()=>{select.value=page.id;render(page.id)}); nodeRoot.append(g); });
      }
      function allControls(page) { return page.controls || []; }
      function outgoing(id) { return oracle.transitions.filter(t => t.source_page === id || (t.source_pages || []).includes(id)); }
      function render(id) {
        const page=pages.get(id); if(!page)return;
        document.querySelectorAll(".node").forEach(n=>n.classList.toggle("selected",n.dataset.page===id));
        document.getElementById("open-page").href=`index.html#/${id}`;
        document.getElementById("page-note").textContent=page.data_only_fields?.length ? `Data-only fields: ${page.data_only_fields.join(", ")}` : "";
        document.getElementById("identity").innerHTML=`<h2>${page.title}</h2><p><code>${page.id}</code> · ${page.variants.length} expected variant${page.variants.length===1?"":"s"}</p><div class="anchor-list">${page.anchors.map(a=>`<span class="badge">${a}</span>`).join("")}</div><table><thead><tr><th>Variant</th><th>Facts</th></tr></thead><tbody>${page.variants.map(v=>`<tr><td><code>${v.id}</code></td><td><code>${JSON.stringify(v.facts)}</code></td></tr>`).join("")}</tbody></table>`;
        document.getElementById("blocks").innerHTML=page.blocks.map(b=>`<tr><td><code>${b.id}</code></td><td>${b.role}${b.shared?" · shared":""}</td><td>${b.scrollable?"scrollable":"static"}</td></tr>`).join("");
        document.getElementById("controls").innerHTML=allControls(page).map(c=>`<tr><td>${c.label}${c.alternate_label?` / ${c.alternate_label}`:""}${c.enabled===false?" · disabled":""}</td><td>${c.type}<br><span class="muted">${c.category}</span></td><td><code>${c.block}</code><br><span class="muted">${c.coverage||c.group||"per control"}</span></td></tr>`).join("");
        const rows=outgoing(id); document.getElementById("transitions").innerHTML=rows.map(t=>`<tr><td>${t.action_label || (t.action_labels||[]).join(" / ") || `${t.action_label_pattern}*`}</td><td><code>${t.target_page==="$source"?id:t.target_page}</code>${t.target_surface?`<br><span class="muted">${t.target_surface}</span>`:""}</td><td>${t.effect}<br><span class="muted">${t.coverage||"per source"}</span></td></tr>`).join("") || `<tr><td colspan="3">No outgoing transitions</td></tr>`;
        const s=page.scroll; const nested=(s.nested_regions||[]).map(region=>`<tr><td>${region.label}</td><td>${region.entry_label}</td><td>${region.depth_rank}</td></tr>`).join(""); document.getElementById("scroll").innerHTML=`<h2>Scroll contract</h2><p><span class="badge">${s.classification}</span></p>${s.classification==="scrollable"?`<table><tbody><tr><th>Scope</th><td>${s.scope}</td></tr><tr><th>Minimum steps</th><td>${s.min_scroll_steps}</td></tr><tr><th>Bottom anchor</th><td>${s.bottom_anchor}</td></tr><tr><th>Restore top</th><td>${s.must_restore_top}</td></tr></tbody></table>`:nested?`<p class="muted">The outer page stays fixed; each listed Region scrolls independently.</p><table><thead><tr><th>Region</th><th>Hidden entry</th><th>Depth</th></tr></thead><tbody>${nested}</tbody></table>`:"<p class=\"muted\">Stable viewport; no whole-page scroll is required.</p>"}`;
      }
      const scrollable=oracle.pages.filter(p=>p.scroll.classification==="scrollable").length;
      const controlCount=oracle.pages.reduce((n,p)=>n+(p.controls||[]).length,0)+oracle.surfaces.reduce((n,s)=>n+(s.controls||[]).length,0);
      document.getElementById("stats").innerHTML=[[oracle.pages.length,"Pages"],[oracle.pages.reduce((n,p)=>n+p.blocks.length,0),"Blocks"],[controlCount,"Controls"],[scrollable,"Long scroll scopes"]].map(([n,l])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join("");
      oracle.pages.forEach(page=>select.add(new Option(page.title,page.id)));
      select.addEventListener("change",()=>render(select.value));
      draw(); render("home");
    })();
  </script>
</body>
</html>
