  <div class="shell">
    <header><div><h1>Mingle mobile oracle</h1><p class="muted">Canonical Pages, blocks, controls, variants, transitions, overlays, and scroll contracts.</p></div><a class="button" id="open-page" href="index.html#/inbox">Open selected page</a></header>
    <section class="stats" id="stats"></section>
    <div class="controls"><label>Inspect Page<select id="page-select"></select></label><span class="muted" id="note"></span></div>
    <section class="grid"><div class="stack"><article class="panel" id="identity"></article><article class="panel"><h2>Blocks</h2><table><thead><tr><th>ID</th><th>Role</th><th>Scroll</th></tr></thead><tbody id="blocks"></tbody></table></article><article class="panel" id="scroll"></article></div><div class="stack"><article class="panel"><h2>Controls</h2><table><thead><tr><th>Label</th><th>Type</th><th>Block / policy</th></tr></thead><tbody id="controls"></tbody></table></article><article class="panel"><h2>Outgoing transitions</h2><table><thead><tr><th>Action</th><th>Target</th><th>Effect</th></tr></thead><tbody id="transitions"></tbody></table></article><article class="panel"><h2>Attached surfaces</h2><table><tbody id="surfaces"></tbody></table></article></div></section>
  </div>
  <script>
    (()=>{const oracle=JSON.parse(document.getElementById("fixture-oracle").textContent);const pages=new Map(oracle.pages.map(p=>[p.id,p]));const select=document.getElementById("page-select");const esc=v=>String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
      const counts=[oracle.pages.length,oracle.pages.reduce((n,p)=>n+p.blocks.length,0),oracle.pages.reduce((n,p)=>n+p.controls.length,0),oracle.transitions.length];document.getElementById("stats").innerHTML=[[counts[0],"Pages"],[counts[1],"Blocks"],[counts[2],"Page controls"],[counts[3],"Transitions"]].map(x=>`<article class="stat"><strong>${x[0]}</strong><span>${x[1]}</span></article>`).join("");
      oracle.pages.forEach(p=>select.add(new Option(p.title,p.id)));
      function render(id){const p=pages.get(id);document.getElementById("open-page").href=`index.html#/${id}`;document.getElementById("note").textContent=`${p.variants.length} variant(s) · ${p.scroll.classification}`;document.getElementById("identity").innerHTML=`<h2>${esc(p.title)} <code>${p.id}</code></h2><div class="anchors">${p.anchors.map(a=>`<span class="badge">${esc(a)}</span>`).join("")}</div>`;document.getElementById("blocks").innerHTML=p.blocks.map(b=>`<tr><td><code>${b.id}</code></td><td>${b.role}</td><td>${b.scrollable?"yes":"no"}</td></tr>`).join("");document.getElementById("controls").innerHTML=p.controls.map(c=>`<tr><td>${esc(c.label)}</td><td>${c.type}</td><td><code>${c.block}</code><br><span class="muted">${c.enabled===false?`blocked: ${c.blocked_reason}`:(c.coverage||c.category)}</span></td></tr>`).join("");const outgoing=oracle.transitions.filter(t=>(t.source_page===id)||(t.source_pages||[]).includes(id));document.getElementById("transitions").innerHTML=outgoing.map(t=>`<tr><td>${esc(t.action_label||(t.action_labels||[]).join(" / ")||t.action_label_pattern)}</td><td><code>${t.target_surface||t.target_page}</code></td><td>${t.effect}</td></tr>`).join("");const surfaces=oracle.surfaces.filter(s=>s.host_pages.includes(id));document.getElementById("surfaces").innerHTML=surfaces.length?surfaces.map(s=>`<tr><td><strong>${s.kind}</strong><br><code>${s.id}</code></td><td>${s.controls.map(c=>esc(c.label)).join(" · ")}</td></tr>`).join(""):`<tr><td class="muted">No attached surface</td></tr>`;const s=p.scroll;document.getElementById("scroll").innerHTML=`<h2>Scroll contract</h2><p><strong>${s.classification}</strong>${s.bottom_anchor?` · bottom: ${esc(s.bottom_anchor)} · minimum ${s.min_scroll_steps} steps`:""}</p>`;}
      select.addEventListener("change",()=>render(select.value));render("inbox");
    })();
  </script>
