<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>编辑提示与想法</title>
<link rel="stylesheet" href="editor.css"><script defer src="editor.js"></script>
</head>
<body><main>
<h1>编辑提示与想法</h1>
<p class="note">在右侧直接改正文。修改和想法会自动保存；左侧保留你开始编辑时的内容。这里保存的是网页候选稿，运行框架保持原样。</p>
<nav><label for="document">当前段落</label><select id="document" disabled></select><button id="save" disabled>保存</button><button id="submit" disabled>准备陌生读者审查</button><a href="/?part=discovery">返回对照页</a></nav>
<p id="status" role="status">正在读取…</p>
<div class="columns">
<section><h2>改前</h2><pre id="base"></pre></section>
<section><h2><label for="draft">你的修改</label></h2><textarea id="draft" spellcheck="false" disabled></textarea>
<button id="annotate" disabled>给选中文字写想法</button>
<h2><label for="idea">这段的整体想法</label></h2><textarea id="idea" rows="3" placeholder="例如：我想让这一步只识别已有对象，这一段是否可以删去？" disabled></textarea>
<div id="notes"></div></section>
</div>
<section><h2>自动记录的修改位置</h2><p class="note">行号分别对应左侧改前内容和右侧已保存内容。选中文字的说明保留你标注时的原文位置。</p><div id="changes"></div></section>
<section id="submission" hidden><h2>审查快照已准备好</h2><p>正文、修改位置和你的想法已保存。复制下面这句话发回对话，我会先让新读者独立读正文，再对照你的想法。此按钮不会自动启动代理。</p><textarea id="review-request" readonly rows="3"></textarea><button id="copy-request">复制审查请求</button><p id="copy-status" role="status"></p></section>
</main></body></html>
