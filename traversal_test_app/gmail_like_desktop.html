<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mosaic Mail</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: Arial, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-width: 1000px; color: #202124; background: #f6f8fc; }
    button { font: inherit; }
    .shell { display: grid; grid-template-rows: 64px minmax(0, 1fr); min-height: 100vh; }
    .appbar { display: grid; grid-template-columns: 272px minmax(360px, 720px) 1fr; align-items: center; gap: 22px; padding: 0 18px; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 20px; color: #45474b; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 28px; border: 3px solid #5c6bc0; border-radius: 5px; color: #5c6bc0; font-size: 14px; }
    .search { display: flex; align-items: center; height: 46px; padding: 0 17px; border-radius: 24px; color: #6d7077; background: #e9eef6; }
    .account { justify-self: end; display: flex; align-items: center; gap: 16px; color: #676b72; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; background: #7d62b5; }
    .workspace { display: grid; grid-template-columns: 66px 230px minmax(0, 1fr) 54px; min-height: 0; }
    .rail { padding: 12px 8px; border-right: 1px solid #e2e5eb; text-align: center; }
    .rail div { margin: 9px 0 22px; color: #686d76; font-size: 11px; }
    .rail b { display: grid; place-items: center; width: 36px; height: 36px; margin: auto; border-radius: 12px; background: #dfe8ff; font-size: 16px; }
    .rail button { display: block; width: 100%; margin: 0 0 12px; padding: 0; border: 0; color: #686d76; background: transparent; cursor: pointer; }
    .rail button span { display: block; margin-top: 6px; font-size: 11px; }
    .rail button[aria-current="page"] b { background: #b9d2ff; }
    .rail button[aria-current="page"] { color: #1f1f1f; font-weight: 700; }
    .folders { padding: 10px 12px; }
    .compose-button { width: 150px; margin: 4px 0 18px; padding: 15px 18px; border: 0; border-radius: 17px; color: #303238; background: #c2e7ff; box-shadow: 0 2px 6px rgba(60,64,67,.15); cursor: pointer; }
    .folders button:not(.compose-button), .folder { display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; border: 0; border-radius: 0 16px 16px 0; color: #5f6368; background: transparent; text-align: left; }
    .folder.selected { color: #1f1f1f; background: #d3e3fd; font-weight: 700; }
    .main { min-width: 0; min-height: 0; margin: 0 0 14px; overflow: auto; border-radius: 15px; background: #fff; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 18px; border-bottom: 1px solid #edf0f4; color: #697078; }
    .mail-row { display: grid; grid-template-columns: 35px 185px minmax(0, 1fr) 82px; align-items: center; gap: 10px; min-height: 54px; padding: 0 18px; border-bottom: 1px solid #eceff3; background: #f4f7fb; }
    .mail-row.unread { background: #fff; font-weight: 700; }
    .mail-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .open { padding: 7px 10px; border: 0; border-radius: 7px; color: #315aa8; background: #e4edff; cursor: pointer; }
    .side-tools { display: grid; align-content: start; justify-items: center; gap: 23px; padding-top: 20px; color: #6d727b; }
    .thread { padding: 26px 34px; }
    .thread-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    h1 { margin: 10px 0 20px; font-size: 25px; font-weight: 500; }
    .message { margin: 18px 0; padding: 18px 0; border-top: 1px solid #eceff3; }
    .message strong { display: block; margin-bottom: 9px; }
    .primary, .secondary { border-radius: 8px; cursor: pointer; }
    .primary { padding: 10px 14px; border: 0; color: #fff; background: #4f64bb; font-weight: 700; }
    .secondary { padding: 9px 12px; border: 1px solid #d8dce3; color: #41454c; background: #fff; }
    .ai-panel { width: 330px; padding: 22px; border-left: 1px solid #e1e4ea; background: #fbfcff; }
    .ai-panel h2 { margin: 6px 0 10px; }
    .ai-card { margin: 18px 0; padding: 15px; border-radius: 12px; background: #eef2ff; }
    .content-split { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 100%; }
    .modal-backdrop { position: fixed; inset: 64px 54px 0 296px; z-index: 5; display: grid; place-items: end center; background: rgba(32,33,36,.18); }
    .toast { position: fixed; right: 24px; bottom: 22px; z-index: 7; padding: 12px 16px; border-radius: 7px; color: #fff; background: #303134; box-shadow: 0 5px 18px rgba(32,33,36,.24); }
    .compose { width: min(660px, calc(100% - 60px)); margin-bottom: 25px; overflow: hidden; border-radius: 11px; background: #fff; box-shadow: 0 12px 40px rgba(32,33,36,.25); }
    .compose header { display: flex; justify-content: space-between; padding: 13px 16px; color: #fff; background: #40444d; }
    .compose form { padding: 16px; }
    .compose label { display: block; padding: 10px 0; border-bottom: 1px solid #e4e7eb; color: #666b73; }
    textarea { width: 100%; height: 150px; margin: 14px 0; padding: 11px; border: 0; resize: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="appbar" data-region-id="mail.appbar"><div class="brand"><span>☰</span><span class="brand-mark">M</span><span>Mosaic Mail</span></div><div class="search">⌕ Search mail</div><div class="account"><span>?</span><span>⚙</span><span class="avatar">A</span></div></header>
    <div class="workspace">
      <nav class="rail" data-region-id="mail.workspace-rail"><button data-route="/inbox" data-action-id="mail.app.mail"><b>✉</b><span>Mail</span></button><button data-route="/chat" data-action-id="mail.app.chat"><b>◫</b><span>Chat</span></button><div><b>♙</b><span>Meet</span></div></nav>
      <nav class="folders" id="context-nav" data-region-id="mail.folder-nav"></nav>
      <main class="main" id="main"></main>
      <aside class="side-tools" data-region-id="mail.side-tools"><span>▣</span><span>◆</span><span>✓</span><span>＋</span></aside>
    </div>
  </div>
  <div class="modal-backdrop" id="compose-backdrop" hidden><section class="compose" data-region-id="mail.compose.modal"><header><strong>New message</strong><button class="secondary" data-action-id="mail.compose.close">Close</button></header><form><label>To: launch-team@example.test</label><label>Subject: Weekly launch update</label><textarea aria-label="Message body">Here is the latest launch update.</textarea><button type="button" class="primary" data-action-id="mail.compose.send">Send</button></form></section></div>
  <div class="toast" id="sent-toast" hidden>Message sent</div>
  <script>
    const pages = { "/inbox": { id: "mail.inbox" }, "/starred": { id: "mail.starred" }, "/thread": { id: "mail.thread" }, "/chat": { id: "mail.chat" } };
    const state = { compose: false, ai: false, sent: false };
    const visits = [], actions = [];
    const route = () => { const value = location.hash.replace(/^#/, "") || "/inbox"; return pages[value] ? value : "/inbox"; };
    const visibleRegions = () => {
      const current = route();
      const mainRegion = current === "/inbox" ? "mail.inbox.list" : current === "/starred" ? "mail.starred.list" : current === "/thread" ? "mail.thread.content" : "chat.conversation";
      const contextRegion = current === "/chat" ? "chat.navigation" : "mail.folder-nav";
      const result = ["mail.appbar", "mail.workspace-rail", contextRegion, mainRegion];
      if (current === "/inbox" && state.compose) result.push("mail.compose.modal");
      if (current === "/thread" && state.ai) result.push("mail.ai.panel");
      result.push("mail.side-tools");
      return result;
    };
    function inbox() { return `<section data-region-id="mail.inbox.list"><div class="toolbar"><span>□ ⟳ ⋮</span><span>4 messages</span></div><div class="mail-row unread"><span>☆</span><strong>Launch team</strong><span>Weekly launch update — decisions and next steps</span><button class="open" data-action-id="mail.inbox.open-thread">Open</button></div><div class="mail-row"><span>☆</span><strong>Research group</strong><span>Interview notes and synthesis are ready</span><span>10:42</span></div><div class="mail-row"><span>☆</span><strong>Design systems</strong><span>Component review is ready</span><span>Yesterday</span></div><div class="mail-row"><span>☆</span><strong>Operations</strong><span>Workspace planning for next week</span><span>Nov 6</span></div></section>`; }
    function starred() { return `<section data-region-id="mail.starred.list"><div class="toolbar"><span>☆ Starred</span><span>2 messages</span></div><div class="mail-row unread"><span>★</span><strong>Launch team</strong><span>Weekly launch update — decisions and next steps</span><button class="open" data-action-id="mail.inbox.open-thread">Open</button></div><div class="mail-row"><span>★</span><strong>Design systems</strong><span>Component review is ready</span><span>Yesterday</span></div></section>`; }
    function thread() { return `<div class="content-split"><article class="thread" data-region-id="mail.thread.content"><div class="thread-head"><button class="secondary" data-action-id="mail.thread.back">← Back to inbox</button><button class="primary" data-action-id="mail.thread.open-ai">Ask Mosaic AI</button></div><h1>Weekly launch update</h1><div class="message"><strong>Jordan Lee · 09:18</strong><p>The website refresh is on track. Please review the final content by Friday.</p></div><div class="message"><strong>Priya Shah · 10:02</strong><p>Research notes are linked in the project database.</p></div></article>${state.ai ? `<aside class="ai-panel" data-region-id="mail.ai.panel"><small>MOSAIC AI</small><h2>Thread summary</h2><div class="ai-card">The launch is on track. Final content review is due Friday, and research notes are already linked.</div><button class="secondary" data-action-id="mail.ai.close">Close AI panel</button></aside>` : ""}</div>`; }
    function chat() { return `<section class="thread" data-region-id="chat.conversation"><h1>Product launch</h1><div class="message"><strong>Alex Chen · 09:12</strong><p>Welcome to the launch channel. The final checklist is pinned above.</p></div><div class="message"><strong>Jordan Lee · 10:08</strong><p>I added the latest website review notes.</p></div></section>`; }
    function mailNavigation() { return `<button class="compose-button" data-action-id="mail.compose.open">✎ Compose</button><button class="folder" data-route="/inbox" data-action-id="mail.folder.inbox"><span>Inbox</span><span>4</span></button><button class="folder" data-route="/starred" data-action-id="mail.folder.starred"><span>Starred</span></button><div class="folder"><span>Snoozed</span></div><div class="folder"><span>Sent</span></div><div class="folder"><span>Drafts</span><span>2</span></div>`; }
    function chatNavigation() { return `<div class="folder selected"><span>Product launch</span></div><div class="folder"><span>Design systems</span></div><div class="folder"><span>Research group</span></div><div class="folder"><span>Direct messages</span><span>3</span></div>`; }
    function render() {
      const current = route(); visits.push(pages[current].id); document.body.dataset.pageId = pages[current].id; document.body.dataset.stateKey = `${pages[current].id}|${state.compose ? "compose" : "no-compose"}|${state.ai ? "ai" : "no-ai"}`;
      document.getElementById("main").innerHTML = current === "/inbox" ? inbox() : current === "/starred" ? starred() : current === "/thread" ? thread() : chat();
      const contextNav = document.getElementById("context-nav"); contextNav.dataset.regionId = current === "/chat" ? "chat.navigation" : "mail.folder-nav"; contextNav.innerHTML = current === "/chat" ? chatNavigation() : mailNavigation();
      document.querySelectorAll(".folders [data-route]").forEach(button => button.classList.toggle("selected", button.dataset.route === current));
      document.querySelectorAll(".rail [data-route]").forEach(button => button.setAttribute("aria-current", current === "/chat" ? button.dataset.route === "/chat" ? "page" : "false" : button.dataset.route === "/inbox" ? "page" : "false"));
      document.getElementById("compose-backdrop").hidden = !(current === "/inbox" && state.compose);
      document.getElementById("sent-toast").hidden = !state.sent;
    }
    function record(id) { actions.push({ actionId: id, pageId: pages[route()].id, regions: visibleRegions() }); }
    function navigate(target, next = {}) { Object.assign(state, { compose: false, ai: false, sent: false }, next); if (route() === target) render(); else location.hash = target; }
    document.addEventListener("click", event => { const target = event.target.closest("[data-action-id]"); if (!target) return; const id = target.dataset.actionId; record(id); if (id !== "mail.compose.send") state.sent = false; if (target.dataset.route) navigate(target.dataset.route); else if (id === "mail.compose.open") { state.compose = true; render(); } else if (id === "mail.compose.close") { state.compose = false; render(); } else if (id === "mail.compose.send") { state.compose = false; state.sent = true; render(); } else if (id === "mail.inbox.open-thread") navigate("/thread"); else if (id === "mail.thread.back") navigate("/inbox"); else if (id === "mail.thread.open-ai") { state.ai = true; render(); } else if (id === "mail.ai.close") { state.ai = false; render(); } });
    addEventListener("hashchange", render);
    window.__fixture = { snapshot: () => ({ pageId: pages[route()].id, stateKey: document.body.dataset.stateKey, regions: visibleRegions(), visits: [...visits], actions: [...actions] }) };
    render();
  </script>
</body>
</html>
