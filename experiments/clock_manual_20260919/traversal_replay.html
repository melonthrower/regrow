<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>探索动画</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff3f1;color:#253e36;font:14px/1.5 system-ui,sans-serif}header{padding:12px 22px;background:white;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}a{color:#226c55}button,select{font:inherit;padding:6px 12px;border:1px solid #bfd1c6;border-radius:8px;background:white;color:#245c47;cursor:pointer}button.on{background:#246d54;color:white}main{height:calc(100vh - 65px);display:grid;grid-template-rows:minmax(240px,52%) auto minmax(200px,1fr)}.screen{background:#192822;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.screen img{width:100%;height:100%;object-fit:contain}.caption{position:absolute;left:14px;bottom:10px;color:white;background:#172b24e8;padding:7px 13px;border-radius:8px;max-width:95%}.controls{padding:10px 20px;background:white;display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{flex:1;min-width:120px;accent-color:#246d54}.map{position:relative;overflow:hidden;background:radial-gradient(#ccdad2 1px,transparent 1px);background-size:20px 20px}.map svg{width:100%;height:100%;display:block}.legend{position:absolute;left:14px;top:8px;font-size:12px;background:#ffffffdc;padding:5px 9px;border-radius:6px}.node rect{fill:#fff;stroke:#abc3b6;stroke-width:2}.node.active rect{stroke:#c18826;stroke-width:4;fill:#fff8e8}.node text{fill:#284638;font:14px system-ui}.node .state{font-size:12px;fill:#657f71}.edge{fill:none;stroke:#719987;stroke-width:2}.edge.active{stroke:#ca8a25;stroke-width:3}.edge-label{font:11px system-ui;fill:#39644e;paint-order:stroke;stroke:#eff3f1;stroke-width:4px}.tools{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}#error{color:#a94730}#marker{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid #ffbe40;box-shadow:0 0 0 7px #ffbe4040;pointer-events:none;transform:translate(-50%,-50%)}small{color:#6c8175}@media(prefers-reduced-motion:no-preference){.node rect{transition:fill .4s,stroke .4s}.screen img{animation:appear .3s}@keyframes appear{from{opacity:.6}to{opacity:1}}}
</style>
<header><h1>探索动画</h1><a href="/">投屏与进度</a><a href="/graph">控件截图与详细状态</a><small>上方：真实历史截图　下方：当时已登记的地图</small><span id="error"></span></header>
<main><section class="screen" id="screen"><img id="frame" alt="框架观察截图"><div id="marker" hidden></div><div class="caption" id="caption">正在读取记录…</div></section>
<div class="controls"><button id="previous" aria-label="上一步">←</button><button id="play">播放回放</button><button id="next" aria-label="下一步">→</button><input id="timeline" type="range" min="0" max="0" value="0" aria-label="探索时间线"><span id="counter"></span><button id="live" class="on">跟随最新</button><select id="speed" aria-label="回放速度"><option value="1600">正常速度</option><option value="700">快速</option><option value="3000">慢速</option></select></div>
<section class="map"><div class="legend">金框：当前观察／操作区块　箭头：已确认的区块跳转　旧节点保留，可拖动画布</div><svg id="map" aria-label="持续扩展的探索地图"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#719987"/></marker></defs><g id="camera"><g id="edges"></g><g id="nodes"></g></g></svg><div class="tools"><button id="minus">－</button><button id="plus">＋</button><button id="center">回到当前</button></div></section></main>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let data=null,index=-1,live=true,playing=false,timer=null,zoom=1,camera={x:0,y:0},motion=0,renderKey='',loadId=0,following=false;
const positions=new Map(),nodes=new Map(),edges=new Map();
function svg(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function setLive(value){live=value;$('live').classList.toggle('on',live)}
function stop(){playing=false;clearTimeout(timer);$('play').textContent='播放回放'}
function transform(){const box=$('map').getBoundingClientRect();$('camera').setAttribute('transform',`translate(${box.width/2-camera.x*zoom},${box.height/2-camera.y*zoom}) scale(${zoom})`)}
function panTo(p){cancelAnimationFrame(motion);const start=performance.now(),from={...camera},duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:650;function tick(t){const k=duration?Math.min(1,(t-start)/duration):1,e=1-Math.pow(1-k,3);camera={x:from.x+(p.x-from.x)*e,y:from.y+(p.y-from.y)*e};transform();if(k<1)motion=requestAnimationFrame(tick)}motion=requestAnimationFrame(tick)}
function place(n,graph){if(positions.has(n.id))return;const parent=graph.edges.find(e=>e.target===n.id&&positions.has(e.source));let p=parent?{x:positions.get(parent.source).x+310,y:positions.get(parent.source).y}:{x:0,y:positions.size*125};while([...positions.values()].some(q=>q.x===p.x&&q.y===p.y))p.y+=125;positions.set(n.id,p)}
function paintMap(event){
 // Accumulate only history up to this event, including nodes absent from later snapshots.
 const history=data.events.slice(0,index+1),known=new Map(),links=new Map();let graph=data.graphs[event.snapshot];
 for(const e of history){const g=data.graphs[e.snapshot];for(const n of g.nodes){place(n,g);known.set(n.id,n)}for(const edge of g.edges)links.set([edge.source,edge.control,edge.target,edge.operation].join('|'),edge)}
 for(const [id,g] of nodes)g.hidden=!known.has(id);
 for(const n of known.values()){
  let g=nodes.get(n.id);if(!g){g=svg('g',{'data-id':n.id,class:'node'});g.append(svg('rect',{x:-120,y:-40,width:240,height:80,rx:12}),svg('text',{x:0,y:-7,'text-anchor':'middle'}),svg('text',{x:0,y:20,'text-anchor':'middle',class:'state'}),svg('title',{},n.name));nodes.set(n.id,g);$('nodes').append(g)}
  g.hidden=false;g.style.display='';const p=positions.get(n.id);g.setAttribute('transform',`translate(${p.x},${p.y})`);g.setAttribute('class','node'+(n.id===event.focus?' active':''));g.children[1].textContent=n.name.length>17?n.name.slice(0,16)+'…':n.name;g.children[2].textContent=n.progress.complete?'已完成':!n.progress.inventory_complete?'尚未完成清点':`待探索 ${n.progress.pending.length} · 受阻 ${n.progress.blocked.length}`;
 }
 for(const [id,g] of nodes)if(!known.has(id))g.style.display='none';
 for(const [key,g] of edges)g.style.display=links.has(key)?'':'none';
 for(const [key,e] of links){let g=edges.get(key);if(!g){g=svg('g');g.append(svg('path',{class:'edge','marker-end':'url(#arrow)'}),svg('text',{class:'edge-label','text-anchor':'middle'}));edges.set(key,g);$('edges').append(g)}
  const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,k=Math.max(Math.abs(dx)/120,Math.abs(dy)/40),sx=a.x+dx/k,sy=a.y+dy/k,tx=b.x-dx/k,ty=b.y-dy/k,off=dx<0?-24:24;
  g.firstChild.setAttribute('d',`M${sx},${sy} Q${(sx+tx)/2},${(sy+ty)/2+off} ${tx},${ty}`);g.firstChild.setAttribute('class','edge'+(e.attempts.includes(event.attempt)?' active':''));g.lastChild.setAttribute('x',(sx+tx)/2);g.lastChild.setAttribute('y',(sy+ty)/2+off/2-5);g.lastChild.textContent=e.control_name;
 }
 if(positions.has(event.focus))panTo(positions.get(event.focus));else transform();
}
function marker(event){const img=$('frame'),box=$('screen').getBoundingClientRect(),a=event.action;$('marker').hidden=true;if(event.kind!=='before'||!a||!Number.isFinite(a.x)||!Number.isFinite(a.y)||!img.naturalWidth)return;const s=Math.min(box.width/img.naturalWidth,box.height/img.naturalHeight);$('marker').style.left=((box.width-img.naturalWidth*s)/2+a.x*s)+'px';$('marker').style.top=((box.height-img.naturalHeight*s)/2+a.y*s)+'px';$('marker').hidden=false}
async function show(i){if(!data?.events.length)return;index=Math.max(0,Math.min(i,data.events.length-1));const event=data.events[index],ticket=++loadId;const img=new Image();if(event.image){img.src=event.image;try{await img.decode()}catch{if(ticket===loadId){$('error').textContent='该帧读取失败，未展示新地图';$('marker').hidden=true;}return}}if(ticket!==loadId)return;
 $('error').textContent='';$('frame').src=event.image||'';$('frame').hidden=!event.image;$('timeline').value=index;$('counter').textContent=`${index+1} / ${data.events.length}`;$('caption').textContent=event.label+(event.reused_image?' · 沿用上一张观察图':'')+(event.kind==='after'?'（地图保留登记前状态）':'');paintMap(event);$('frame').onload=()=>marker(event);marker(event);renderKey=JSON.stringify(event);
}
function advance(){if(!playing)return;if(index>=data.events.length-1){stop();return}show(index+1);timer=setTimeout(advance,Number($('speed').value))}
$('play').onclick=()=>{if(playing){stop();return}setLive(false);playing=true;$('play').textContent='暂停回放';if(index>=data.events.length-1)show(0);timer=setTimeout(advance,Number($('speed').value))};
$('previous').onclick=()=>{stop();setLive(false);show(index-1)};$('next').onclick=()=>{stop();setLive(false);show(index+1)};$('timeline').oninput=()=>{stop();setLive(false);show(Number($('timeline').value))};$('live').onclick=()=>{stop();setLive(true);show(data.events.length-1)};
$('plus').onclick=()=>{zoom=Math.min(2,zoom+.15);transform()};$('minus').onclick=()=>{zoom=Math.max(.25,zoom-.15);transform()};$('center').onclick=()=>{const e=data?.events[index];if(e&&positions.has(e.focus))panTo(positions.get(e.focus))};
let drag=null;$('map').onpointerdown=e=>{cancelAnimationFrame(motion);drag={x:e.clientX,y:e.clientY,...{cx:camera.x,cy:camera.y}};$('map').setPointerCapture(e.pointerId)};$('map').onpointermove=e=>{if(drag){camera={x:drag.cx-(e.clientX-drag.x)/zoom,y:drag.cy-(e.clientY-drag.y)/zoom};transform()}};$('map').onpointerup=()=>drag=null;window.onresize=()=>{transform();if(data?.events[index])marker(data.events[index])};
async function follow(){if(following)return;following=true;try{while(live&&!document.hidden&&index<data.events.length-1){await show(index+1);await new Promise(r=>setTimeout(r,Number($('speed').value)))}}finally{following=false}}
async function poll(){try{if(document.hidden)return;const r=await fetch('/replay.json');if(!r.ok)throw Error();const next=await r.json(),id=data?.events[index]?.id;data=next;$('timeline').max=Math.max(0,data.events.length-1);const target=index<0?data.events.length-1:Math.max(0,data.events.findIndex(e=>e.id===id));if(index<0||JSON.stringify(data.events[target])!==renderKey)await show(target);else index=target;if(live)follow();}catch{$('error').textContent='记录暂不可读，保留上次画面'}finally{setTimeout(poll,3000)}}poll();
</script></html>
