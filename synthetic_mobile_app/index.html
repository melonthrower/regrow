<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Mingle</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#1d2524; --muted:#71807d; --line:#e5ebe9; --surface:#fff;
      --canvas:#edf2f0; --primary:#13866f; --primary-soft:#e0f4ee;
      --bubble:#edf1f0; --own:#dff5ed; --danger:#c83f4d; --shadow:0 18px 55px rgba(21,50,43,.16);
    }
    * { box-sizing:border-box; }
    html { background:var(--canvas); }
    body { margin:0; min-width:320px; color:var(--ink); background:var(--canvas); font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-tap-highlight-color:transparent; }
    button,input { font:inherit; }
    button { color:inherit; }
    #mobile-app { width:min(100%,430px); min-height:100vh; margin:0 auto; background:#f7faf9; box-shadow:var(--shadow); }
    .page { min-height:100vh; background:#f7faf9; }
    .app-bar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; min-height:66px; padding:10px 14px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.97); }
    .app-bar h1 { flex:1; margin:0; font-size:22px; line-height:1.15; }
    .app-bar .subtitle { display:block; color:var(--muted); font-size:12px; font-weight:500; }
    .icon-button,.back-button { display:grid; place-items:center; min-width:42px; height:42px; padding:0 10px; border:0; border-radius:13px; background:transparent; cursor:pointer; font-weight:800; }
    .icon-button { font-size:23px; }
    .icon-button:active,.back-button:active,.row-button:active { background:var(--primary-soft); }
    main { padding:14px 14px 24px; }
    .section-label { margin:6px 4px 11px; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
    .search-box { display:flex; align-items:center; gap:8px; margin:0 0 12px; padding:10px 13px; border:1px solid var(--line); border-radius:14px; background:#fff; }
    .search-box input { width:100%; border:0; outline:0; background:transparent; }
    .list { display:grid; gap:0; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#fff; }
    .chat-row,.contact-row,.menu-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; min-height:76px; padding:11px 13px; border:0; border-bottom:1px solid var(--line); text-align:left; background:#fff; cursor:pointer; }
    .chat-row:last-child,.contact-row:last-child,.menu-row:last-child { border-bottom:0; }
    .avatar { display:grid; place-items:center; width:48px; height:48px; border-radius:16px; color:#fff; background:#5f6fc5; font-weight:850; }
    .avatar.green{background:#188670}.avatar.orange{background:#d17738}.avatar.pink{background:#b75a80}.avatar.gray{background:#657370}
    .row-title { display:flex; justify-content:space-between; gap:10px; font-weight:780; }
    .row-title time { color:var(--muted); font-size:11px; font-weight:500; }
    .row-preview { overflow:hidden; color:var(--muted); font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
    .unread { display:grid; place-items:center; min-width:22px; height:22px; padding:0 6px; border-radius:12px; color:#fff; background:var(--primary); font-size:11px; font-weight:800; }
    .fab { position:fixed; z-index:30; right:max(18px,calc((100vw - 430px)/2 + 18px)); bottom:84px; min-width:58px; height:58px; padding:0 18px; border:0; border-radius:20px; color:#fff; background:var(--primary); box-shadow:0 12px 28px rgba(19,134,111,.34); cursor:pointer; font-size:25px; }
    .bottom-nav { position:sticky; bottom:0; z-index:18; display:grid; grid-template-columns:repeat(4,1fr); padding:7px 5px 9px; border-top:1px solid var(--line); background:rgba(255,255,255,.98); }
    .nav-button { display:grid; justify-items:center; gap:2px; min-height:52px; padding:6px 2px 4px; border:0; border-radius:12px; color:var(--muted); background:transparent; font-size:11px; font-weight:750; cursor:pointer; }
    .nav-icon { display:grid; place-items:center; width:27px; height:25px; border-radius:9px; font-size:13px; }
    .nav-button[aria-current="page"] { color:var(--primary); }
    .nav-button[aria-current="page"] .nav-icon { color:#fff; background:var(--primary); }
    .pinned { margin:0 14px 10px; padding:10px 13px; border-radius:13px; color:#46625c; background:var(--primary-soft); font-size:12px; }
    .thread { display:grid; gap:11px; padding:6px 14px 92px; }
    .day-divider { justify-self:center; padding:4px 10px; border-radius:12px; color:var(--muted); background:#e8eeec; font-size:11px; }
    .message { display:grid; grid-template-columns:34px minmax(0,1fr); align-items:end; gap:7px; max-width:86%; }
    .message.own { justify-self:end; grid-template-columns:minmax(0,1fr); }
    .message .avatar { width:34px; height:34px; border-radius:12px; font-size:11px; }
    .bubble { padding:10px 12px; border-radius:16px 16px 16px 5px; background:var(--bubble); }
    .own .bubble { border-radius:16px 16px 5px 16px; background:var(--own); }
    .bubble strong { display:block; margin-bottom:2px; color:#4c655f; font-size:11px; }
    .bubble time { display:block; margin-top:4px; color:var(--muted); font-size:10px; text-align:right; }
    .composer { position:fixed; z-index:25; left:max(0px,calc((100vw - 430px)/2)); right:max(0px,calc((100vw - 430px)/2)); bottom:0; display:grid; grid-template-columns:42px minmax(0,1fr) 48px; align-items:center; gap:6px; min-height:70px; padding:9px 10px; border-top:1px solid var(--line); background:#fff; }
    .composer input { min-width:0; height:45px; padding:0 13px; border:1px solid var(--line); border-radius:16px; outline:0; background:#f5f8f7; }
    .send-button { height:44px; border:0; border-radius:15px; color:#fff; background:var(--primary); font-weight:800; cursor:pointer; }
    .shortcut-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
    .shortcut { display:grid; gap:10px; min-height:95px; padding:15px; border:1px solid var(--line); border-radius:17px; text-align:left; background:#fff; cursor:pointer; font-weight:780; }
    .shortcut span { color:var(--muted); font-size:12px; font-weight:500; }
    .profile-card { display:grid; justify-items:center; padding:28px 18px 24px; text-align:center; }
    .profile-card .avatar { width:84px; height:84px; border-radius:27px; font-size:24px; }
    .profile-card h2 { margin:14px 0 3px; }
    .profile-card p { margin:0; color:var(--muted); }
    .action-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
    .primary-button,.secondary-button { min-height:48px; border-radius:15px; cursor:pointer; font-weight:780; }
    .primary-button { border:0; color:#fff; background:var(--primary); }
    .secondary-button { border:1px solid var(--line); background:#fff; }
    .setting-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; min-height:72px; padding:14px; border-bottom:1px solid var(--line); background:#fff; }
    .setting-row:last-child { border-bottom:0; }
    .setting-row strong { display:block; }
    .setting-row small { color:var(--muted); }
    .switch-button { display:flex; align-items:center; width:50px; height:30px; padding:4px; border:0; border-radius:18px; background:#aab6b3; cursor:pointer; }
    .switch-button::after { content:""; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s ease; }
    .switch-button[aria-pressed="true"] { background:var(--primary); }
    .switch-button[aria-pressed="true"]::after { transform:translateX(20px); }
    .danger-button { width:100%; min-height:50px; border:1px solid #f0cbd0; border-radius:15px; color:var(--danger); background:#fff; font-weight:780; cursor:pointer; }
    .overlay { position:fixed; inset:0; z-index:70; display:grid; align-items:end; justify-items:center; background:rgba(19,29,27,.46); }
    .sheet { width:min(430px,100%); padding:18px 16px 24px; border-radius:24px 24px 0 0; background:#fff; box-shadow:0 -18px 50px rgba(15,31,27,.18); }
    .sheet-handle { width:42px; height:5px; margin:0 auto 14px; border-radius:4px; background:#ced6d4; }
    .sheet h2 { margin:0 0 3px; font-size:20px; }.sheet p{margin:0 0 14px;color:var(--muted)}
    .sheet-button { width:100%; min-height:50px; margin-top:8px; padding:0 14px; border:0; border-radius:14px; text-align:left; background:#f1f6f4; font-weight:760; cursor:pointer; }
    .sheet-button:disabled { color:#8c9895; cursor:not-allowed; }
    .dialog { align-self:center; width:min(350px,calc(100% - 34px)); padding:22px; border-radius:22px; background:#fff; box-shadow:var(--shadow); }
    .dialog h2{margin:0 0 7px}.dialog p{margin:0 0 20px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:9px}
    .member-row { display:flex; gap:12px; padding:14px; overflow-x:auto; border:1px solid var(--line); border-radius:18px; background:#fff; }
    .member { display:grid; justify-items:center; gap:5px; min-width:58px; color:var(--muted); font-size:11px; }.member .avatar{width:48px;height:48px}
    @media (max-width:430px) { #mobile-app{box-shadow:none}.fab{right:18px}.composer{left:0;right:0} }
  </style>
</head>

rget_page":"conversation","effect":"return","required":true},{"id":"chat_info.mute","source_page":"chat_info","action_label":"Mute notifications","target_page":"chat_info","effect":"state_change","required":true},{"id":"chat_info.clear","source_page":"chat_info","action_label":"Clear chat history","target_page":"chat_info","target_surface":"chat_info.clear_dialog","effect":"open_dialog","required":true},{"id":"clear.cancel","source_page":"chat_info","source_surface":"chat_info.clear_dialog","action_label":"Cancel","target_page":"chat_info","effect":"dismiss_overlay","required":true},{"id":"clear.confirm","source_page":"chat_info","source_surface":"chat_info.clear_dialog","action_label":"Clear history","target_page":"inbox","effect":"forward","required":false},{"id":"inbox.nav_contacts","source_page":"inbox","action_label":"Contacts","target_page":"contacts","effect":"peer_navigation","required":true},{"id":"inbox.nav_explore","source_page":"inbox","action_label":"Explore","target_page":"explore","effect":"peer_navigation","required":true},{"id":"inbox.nav_profile","source_page":"inbox","action_label":"Me","target_page":"profile","effect":"peer_navigation","required":true},{"id":"contacts.nav_inbox","source_page":"contacts","action_label":"Chats","target_page":"inbox","effect":"peer_navigation","required":true},{"id":"contacts.nav_explore","source_page":"contacts","action_label":"Explore","target_page":"explore","effect":"peer_navigation","required":true},{"id":"contacts.nav_profile","source_page":"contacts","action_label":"Me","target_page":"profile","effect":"peer_navigation","required":true},{"id":"explore.nav_inbox","source_page":"explore","action_label":"Chats","target_page":"inbox","effect":"peer_navigation","required":true},{"id":"explore.nav_contacts","source_page":"explore","action_label":"Contacts","target_page":"contacts","effect":"peer_navigation","required":true},{"id":"explore.nav_profile","source_page":"explore","action_label":"Me","target_page":"profi   <div id="mobile-app" aria-live="polite"></div>
  <script>
    (() => {
      "use strict";
      const oracle = JSON.parse(document.getElementById("fixture-oracle").textContent);
      const root = document.getElementById("mobile-app");
      const KEY = "rewalk.mingle.state.v1";
      const defaults = { searchOpen:false, favorite:false, notifications:true, muted:false, messageSent:false };
      let state;
      try { state = { ...defaults, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (_) { state = {...defaults}; }
      let currentPage = "inbox";
      let overlay = null;
      const save = () => localStorage.setItem(KEY, JSON.stringify(state));
      const esc = value => String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
      const attrs = (id, block, target="") => `data-action-id="${esc(id)}" data-block-id="${esc(block)}"${target ? ` data-target-page="${esc(target)}"` : ""}`;
      function route() { const raw=location.hash.replace(/^#\/?/,"").split("?")[0]; return oracle.pages.some(p=>p.id===raw)?raw:"inbox"; }
      function navigate(page) { overlay=null; const next=`#/${page}`; if(location.hash===next){currentPage=page;scrollTo(0,0);render();}else location.hash=next; }
      function appBar(title,page,options={}) { return `<header class="app-bar" data-block-id="${page}.app_bar">${options.back ? `<button type="button" class="back-button" aria-label="${esc(options.back.label)}" ${attrs(options.back.id,`${page}.app_bar`,options.back.target)}>‹</button>`:""}<h1>${esc(title)}${options.subtitle?`<span class="subtitle">${esc(options.subtitle)}</span>`:""}</h1>${(options.actions||[]).map(a=>`<button type="button" class="icon-button" aria-label="${esc(a.label)}" ${a.disabled?"disabled":""} ${attrs(a.id,`${page}.app_bar`,a.target||"")}>${a.icon}</button>`).join("")}</header>`; }
      function bottomNav(page) { const items=[["inbox","C","Chats"],["contacts","P","Contacts"],["explore","E","Explore"],["profile","M","Me"]]; return `<nav class="bottom-nav" aria-label="Primary navigation" data-block-id="${page}.bottom_nav">${items.map(([id,icon,label])=>`<button type="button" class="nav-button" ${id===page?'aria-current="page"':""} ${attrs(`${page}.nav_${id}`,`${page}.bottom_nav`,id)}><span class="nav-icon">${icon}</span>${label}</button>`).join("")}</nav>`; }
      function shell(page,inner,nav=true){return `<div class="page" data-page-id="${page}" data-surface-kind="page">${inner}${nav?bottomNav(page):""}</div>`;}

      const chats = [
        ["WP","Weekend Plan","Mira: I booked the picnic table","09:42","3","green"],
        ["AC","Alex Chen","The mockups look great","08:17","1","orange"],
        ["DA","Design Archive","Lin shared a document","Yesterday","","pink"],
        ["FL","Family","Dad: Dinner at seven?","Yesterday","2","gray"],
        ["RB","Reading Buddies","Next book: The Dispossessed","Mon","","green"],
        ["MC","Mira Cole","Thank you!","Sun","","pink"],
        ["TT","Tuesday Tennis","Court 4 is confirmed","Sat","","orange"],
        ["NL","Neighborhood","Road work begins tomorrow","Fri","","gray"],
        ["ST","Studio Team","Ada: Uploaded the exports","Thu","","pink"],
        ["JR","Jordan Rivera","Coffee next week?","Wed","","green"],
        ["BK","Book Club","Poll closes tonight","Tue","","orange"],
        ["GC","Garden Club","Seed swap is next month","Jul 8","","green"],
        ["KS","Kitchen Stories","Mira shared a recipe","Jul 6","","pink"],
        ["RM","Running Mates","Easy 5K on Sunday","Jul 4","","orange"],
        ["AT","Art Thursday","Gallery tickets are booked","Jul 2","","gray"],
        ["CV","City Volunteers","Meet at the library","Jun 30","","green"],
        ["PA","Project Aurora","Weekly notes are ready","Jun 28","","gray"]
      ];
      function renderInbox(){ const rows=chats.map((c,i)=>`<button type="button" class="chat-row" ${attrs(i===0?"inbox.open_weekend":i===1?"inbox.open_alex":`inbox.chat_${i+1}`,"inbox.chat_list",i<2?"conversation":"")} ${i>1?"disabled":""}><span class="avatar ${c[5]}">${c[0]}</span><span><span class="row-title"><span>${c[1]}</span><time>${c[3]}</time></span><span class="row-preview">${c[2]}</span></span>${c[4]?`<span class="unread">${c[4]}</span>`:"<span></span>"}</button>`).join(""); return shell("inbox",`${appBar("Chats","inbox",{actions:[{id:"inbox.search",label:state.searchOpen?"Close search":"Search chats",icon:state.searchOpen?"×":"⌕"}]})}<main>${state.searchOpen?`<label class="search-box"><span>⌕</span><input aria-label="Search chats" placeholder="Search people and messages"></label>`:""}<p class="section-label">Recent chats</p><section class="list" data-block-id="inbox.chat_list" data-scrollable="true">${rows}</section></main><button type="button" class="fab" aria-label="New chat" ${attrs("inbox.new_chat","inbox.fab")}>＋</button>`); }

      const messageData = [
        ["Mira","MC","I checked the weather. Saturday looks clear!","09:02","pink"],
        ["own","","Perfect. Should we meet near the north gate?","09:05",""],
        ["Alex","AC","Yes, that entrance is closest to the river.","09:08","orange"],
        ["Lin","LN","I can bring fruit and sparkling water.","09:11","green"],
        ["own","","I will bring the picnic blanket.","09:14",""],
        ["Mira","MC","Do we need plates and cups?","09:18","pink"],
        ["Alex","AC","I have compostable ones at home.","09:21","orange"],
        ["Lin","LN","Great, I added everything to the list.","09:25","green"],
        ["own","","What about music?","09:29",""],
        ["Mira","MC","I made a relaxed playlist yesterday.","09:31","pink"],
        ["Alex","AC","Can you share it here?","09:34","orange"],
        ["Mira","MC","Shared! It should be visible to everyone.","09:36","pink"],
        ["Lin","LN","I will arrive a little early to set up.","09:38","green"],
        ["own","","Thanks, Lin. I can help.","09:39",""],
        ["Mira","MC","I put the directions in our shared note.","09:40","pink"],
        ["Alex","AC","The path by the café is under repair.","09:40","orange"],
        ["Lin","LN","Then the riverside path is probably easier.","09:41","green"],
        ["own","","Agreed. I will update the pinned note.","09:41",""],
        ["Mira","MC","Does anyone need a ride home?","09:41","pink"],
        ["Lin","LN","I am cycling, but thank you.","09:42","green"],
        ["own","","I can take Alex and Mira.","09:42",""],
        ["Alex","AC","See you by the north gate.","09:42","orange"]
      ];
      function renderConversation(){ const messages=messageData.map((m,i)=>m[0]==="own"?`<article class="message own"><div class="bubble">${m[2]}<time>${m[3]}</time></div></article>`:`<article class="message"><span class="avatar ${m[4]}">${m[1]}</span><div class="bubble"><strong>${m[0]}</strong>${m[2]}<time>${m[3]}</time></div></article>`).join(""); const sent=state.messageSent?`<article class="message own"><div class="bubble">Sounds good — see you there!<time>09:44</time></div></article>`:""; return shell("conversation",`${appBar("Weekend Plan","conversation",{subtitle:"4 members",back:{id:"conversation.back",label:"Back to chats",target:"inbox"},actions:[{id:"conversation.call",label:"Voice call",icon:"◖",disabled:true},{id:"conversation.info",label:"Chat info",icon:"⋯",target:"chat_info"}]})}<section class="pinned" data-block-id="conversation.pinned"><strong>Pinned:</strong> Riverside picnic at 10:30</section><section class="thread" data-block-id="conversation.messages" data-scrollable="true"><div class="day-divider">Today</div>${messages}${sent}</section><section class="composer" data-block-id="conversation.composer"><button type="button" class="icon-button" aria-label="Add attachment" ${attrs("conversation.attach","conversation.composer")}>＋</button><input aria-label="Message" data-action-id="conversation.message" data-block-id="conversation.composer" placeholder="Message"><button type="button" class="send-button" aria-label="Send message" ${attrs("conversation.send","conversation.composer")}>Send</button></section>`,false); }

      const names=["Alex Chen","Ada Brooks","Ben Ortiz","Carmen Diaz","Daria Kim","Eli Wong","Fatima Noor","George Park","Hana Ito","Isa Reed","Jordan Rivera","Kai Bell","Lin Zhao","Mira Cole","Noah Smith","Zoe Wu"];
      function renderContacts(){ const rows=names.map((name,i)=>`<button type="button" class="contact-row" ${attrs(i===0?"contacts.open_alex":`contacts.person_${i+1}`,"contacts.list",i===0?"contact_profile":"")} ${i>0?"disabled":""}><span class="avatar ${["orange","green","pink","gray"][i%4]}">${name.split(" ").map(x=>x[0]).join("")}</span><span><strong>${name}</strong><span class="row-preview">${i%3===0?"Online":"Last active recently"}</span></span><span>›</span></button>`).join(""); return shell("contacts",`${appBar("Contacts","contacts",{actions:[{id:"contacts.add",label:"Add contact",icon:"＋",disabled:true}]})}<main><section class="shortcut-grid" data-block-id="contacts.shortcuts"><button type="button" class="shortcut" disabled ${attrs("contacts.new_friends","contacts.shortcuts")}><strong>New friends</strong><span>Review requests</span></button><button type="button" class="shortcut" disabled><strong>Groups</strong><span>6 conversations</span></button></section><p class="section-label">All contacts</p><section class="list" data-block-id="contacts.list" data-scrollable="true">${rows}</section></main>`); }

      function renderContact(){ return shell("contact_profile",`${appBar("Alex Chen","contact",{back:{id:"contact.back",label:"Back to contacts",target:"contacts"}})}<main><section class="profile-card" data-block-id="contact.identity"><span class="avatar orange">AC</span><h2>Alex Chen</h2><p>alex.chen@example.com</p></section><section class="action-grid" data-block-id="contact.actions"><button type="button" class="primary-button" ${attrs("contact.message","contact.actions","conversation")}>Send message</button><button type="button" class="secondary-button" disabled>Voice call</button></section><section class="list" data-block-id="contact.preferences"><article class="setting-row"><div><strong>Favorite contact</strong><small>Keep Alex at the top of Contacts</small></div><button type="button" class="switch-button" aria-label="${state.favorite?"Remove from favorites":"Add to favorites"}" aria-pressed="${state.favorite}" ${attrs("contact.favorite","contact.preferences")}></button></article></section></main>`,false); }

      function renderExplore(){ return shell("explore",`${appBar("Explore","explore")}<main><p class="section-label">Everyday tools</p><section class="shortcut-grid" data-block-id="explore.services"><button class="shortcut" disabled ${attrs("explore.moments","explore.services")}><strong>Moments</strong><span>Updates from friends</span></button><button class="shortcut" disabled ${attrs("explore.saved","explore.services")}><strong>Saved messages</strong><span>Your private notes</span></button><button class="shortcut" disabled ${attrs("explore.scan","explore.services")}><strong>Scan</strong><span>Use the camera</span></button><button class="shortcut" disabled><strong>Mini apps</strong><span>Useful shortcuts</span></button></section><section class="profile-card" data-block-id="explore.updates"><span class="avatar green">M</span><h2>A quieter way to keep in touch</h2><p>Mingle keeps your conversations and contacts together without a noisy feed.</p></section></main>`); }

      function renderProfile(){ return shell("profile",`${appBar("Me","profile")}<main><section class="profile-card" data-block-id="profile.account"><span class="avatar green">AL</span><h2>Alex Lee</h2><p>Mingle ID: alex.lee</p></section><section class="list" data-block-id="profile.menu"><button type="button" class="menu-row" disabled ${attrs("profile.saved","profile.menu")}><span class="avatar gray">S</span><span><strong>Saved messages</strong><span class="row-preview">Notes only you can see</span></span><span>›</span></button><button type="button" class="menu-row" ${attrs("profile.settings","profile.menu","settings")}><span class="avatar green">S</span><span><strong>Settings</strong><span class="row-preview">Notifications and privacy</span></span><span>›</span></button></section></main>`); }

      function renderSettings(){ return shell("settings",`${appBar("Settings","settings",{back:{id:"settings.back",label:"Back to me",target:"profile"}})}<main><p class="section-label">Notifications</p><section class="list" data-block-id="settings.notifications"><article class="setting-row"><div><strong>Message notifications</strong><small>Show alerts for new messages</small></div><button type="button" class="switch-button" aria-label="Message notifications" aria-pressed="${state.notifications}" ${attrs("settings.notifications_toggle","settings.notifications")}></button></article></section><p class="section-label">Account</p><section class="list" data-block-id="settings.privacy"><button type="button" class="menu-row" disabled ${attrs("settings.privacy_open","settings.privacy")}><span class="avatar gray">P</span><span><strong>Privacy</strong><span class="row-preview">Visibility and blocked contacts</span></span><span>›</span></button></section><p class="section-label">Application</p><section class="list" data-block-id="settings.about"><button type="button" class="menu-row" disabled ${attrs("settings.about_open","settings.about")}><span class="avatar green">M</span><span><strong>About Mingle</strong><span class="row-preview">Version 1.0</span></span><span>›</span></button></section></main>`,false); }

      function renderChatInfo(){ const members=[["MC","Mira","pink"],["AC","Alex","orange"],["LN","Lin","green"],["AL","You","gray"]].map(m=>`<div class="member"><span class="avatar ${m[2]}">${m[0]}</span>${m[1]}</div>`).join(""); return shell("chat_info",`${appBar("Chat info","chat_info",{back:{id:"chat_info.back",label:"Back to conversation",target:"conversation"}})}<main><p class="section-label">4 members</p><section class="member-row" data-block-id="chat_info.members">${members}<button type="button" class="member" disabled ${attrs("chat_info.add_member","chat_info.members")}><span class="avatar gray">＋</span>Add</button></section><p class="section-label">Conversation</p><section class="list" data-block-id="chat_info.preferences"><article class="setting-row"><div><strong>Mute notifications</strong><small>${state.muted?"Muted":"Messages will notify you"}</small></div><button type="button" class="switch-button" aria-label="Mute notifications" aria-pressed="${state.muted}" ${attrs("chat_info.mute","chat_info.preferences")}></button></article></section><p class="section-label">History</p><section class="list" data-block-id="chat_info.history"><button type="button" class="menu-row" disabled ${attrs("chat_info.search_history","chat_info.history")}><span class="avatar gray">⌕</span><span><strong>Search chat history</strong><span class="row-preview">Find past messages</span></span><span>›</span></button></section><p class="section-label">Storage</p><section data-block-id="chat_info.danger"><button type="button" class="danger-button" ${attrs("chat_info.clear","chat_info.danger")}>Clear chat history</button></section></main>`,false); }

      function renderOverlay(){ if(overlay==="new_chat") return `<div class="overlay" data-surface-id="inbox.new_chat_sheet" data-surface-kind="bottom_sheet"><section class="sheet"><div class="sheet-handle"></div><h2>Start a conversation</h2><p>Choose how you want to connect.</p><button class="sheet-button" disabled ${attrs("new_chat.direct","inbox.new_chat_sheet")}>New direct message</button><button class="sheet-button" disabled ${attrs("new_chat.group","inbox.new_chat_sheet")}>New group</button><button class="sheet-button" ${attrs("new_chat.close","inbox.new_chat_sheet")}>Close new chat menu</button></section></div>`; if(overlay==="attach") return `<div class="overlay" data-surface-id="conversation.attach_sheet" data-surface-kind="bottom_sheet"><section class="sheet"><div class="sheet-handle"></div><h2>Share with Weekend Plan</h2><p>Attachments stay in this conversation.</p>${["Photo","Camera","Location"].map(x=>`<button class="sheet-button" disabled ${attrs(`attach.${x.toLowerCase()}`,"conversation.attach_sheet")}>${x}</button>`).join("")}<button class="sheet-button" ${attrs("attach.close","conversation.attach_sheet")}>Close attachment menu</button></section></div>`; if(overlay==="clear") return `<div class="overlay" data-surface-id="chat_info.clear_dialog" data-surface-kind="dialog"><section class="dialog" role="dialog" aria-modal="true"><h2>Delete local messages?</h2><p>This removes the local message history for Weekend Plan.</p><div class="dialog-actions"><button class="secondary-button" ${attrs("clear.cancel","chat_info.clear_dialog")}>Cancel</button><button class="primary-button" ${attrs("clear.confirm","chat_info.clear_dialog","inbox")}>Clear history</button></div></section></div>`; return ""; }

      const renderers={inbox:renderInbox,conversation:renderConversation,contacts:renderContacts,contact_profile:renderContact,explore:renderExplore,profile:renderProfile,settings:renderSettings,chat_info:renderChatInfo};
      function render(){ currentPage=route(); root.innerHTML=(renderers[currentPage]||renderInbox)()+renderOverlay(); root.dataset.currentPage=currentPage; root.dataset.currentOverlay=overlay||"none"; document.title=`${oracle.pages.find(p=>p.id===currentPage)?.title||"Chats"} · Mingle`; }
      root.addEventListener("click",event=>{ const button=event.target.closest("button[data-action-id]"); if(!button||button.disabled)return; const id=button.dataset.actionId; if(id==="inbox.search"){state.searchOpen=!state.searchOpen;save();render();return;} if(id==="inbox.new_chat"){overlay="new_chat";render();return;} if(id==="conversation.attach"){overlay="attach";render();return;} if(id==="chat_info.clear"){overlay="clear";render();return;} if(["new_chat.close","attach.close","clear.cancel"].includes(id)){overlay=null;render();return;} if(id==="clear.confirm"){state.messageSent=false;save();navigate("inbox");return;} if(id==="conversation.send"){state.messageSent=true;save();render();scrollTo(0,document.body.scrollHeight);return;} if(id==="contact.favorite"){state.favorite=!state.favorite;save();render();return;} if(id==="settings.notifications_toggle"){state.notifications=!state.notifications;save();render();return;} if(id==="chat_info.mute"){state.muted=!state.muted;save();render();return;} const target=button.dataset.targetPage;if(target)navigate(target); });
      window.addEventListener("hashchange",()=>{overlay=null;scrollTo(0,0);render();});
      window.__mingle={oracle,navigate,openNewChat:()=>{currentPage="inbox";overlay="new_chat";render();},openAttach:()=>{currentPage="conversation";overlay="attach";render();},openClear:()=>{currentPage="chat_info";overlay="clear";render();},reset:()=>{localStorage.removeItem(KEY);state={...defaults};overlay=null;navigate("inbox");},snapshot:()=>({page:currentPage,overlay,state:{...state}})};
      if(!location.hash)location.replace("#/inbox");else render();
    })();
  </script>
